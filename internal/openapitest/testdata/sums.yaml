openapi: 3.1.0
info:
  title: Sums
  version: 1.0.0
  description: An API whose answer is a schema of counters.yaml.
paths:
  /counters/total:
    get:
      operationId: getSum
      responses:
        '200':
          description: The sum of the counters.
          content:
            application/json:
              schema:
                $ref: 'counters.yaml#/components/schemas/Counter'
