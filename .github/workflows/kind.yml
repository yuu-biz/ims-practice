name: kind

# Runs only when a file it depends on changes: the manifests and the
# script, and everything the images are built from, the code included.
on:
  push:
    branches: [main]
    paths:
      - deploy/k8s/**
      - scripts/e2e-lib.sh
      - deploy/compose/**
      - Dockerfile
      - .dockerignore
      - images/**
      - cmd/**
      - internal/**
      - web/**
      - deploy/announcements/**
      - go.mod
      - go.sum
      - .github/workflows/kind.yml
  pull_request:
    paths:
      - deploy/k8s/**
      - scripts/e2e-lib.sh
      - deploy/compose/**
      - Dockerfile
      - .dockerignore
      - images/**
      - cmd/**
      - internal/**
      - web/**
      - deploy/announcements/**
      - go.mod
      - go.sum
      - .github/workflows/kind.yml

jobs:
  e2e-kind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay: [external-dns, cluster-dns]
    # The checksums are written here rather than downloaded beside the
    # binaries, so that a server that hands out another binary cannot
    # hand out a checksum that matches it. KIND_SHA256 is the line of
    # kind-linux-amd64 in kind-linux-amd64.sha256sum of the release
    # v0.33.0 on GitHub, and KUBECTL_SHA256 is the content of
    # https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl.sha256.
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.2
      KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
    steps:
      - uses: actions/checkout@v7
      - name: install kind and kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  kind" | sha256sum -c
          curl -fsSLo kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  kubectl" | sha256sum -c
          chmod +x kind kubectl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: deploy/k8s/e2e-kind.sh ${{ matrix.overlay }}
      - name: upload the capture and the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kind-${{ matrix.overlay }}
          path: |
            e2e-out/kind-${{ matrix.overlay }}/*.pcap
            e2e-out/kind-${{ matrix.overlay }}/*.txt
            e2e-out/kind-${{ matrix.overlay }}/logs/
          if-no-files-found: warn
