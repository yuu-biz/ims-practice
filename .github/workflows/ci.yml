name: ci

# A newer push to the same branch cancels the run of an older one.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each kind of change runs the jobs that it can break, and a skipped
  # job counts as passed:
  # - A change of code, which is any file outside the documents (.md,
  #   docs/, the licence files) and outside slides/, runs every job.
  # - The packages of the slide generator under slides/ import no other
  #   package of the repository, and none imports them. A
  #   change to it, or to any other document, runs the slide-tests job,
  #   since the generator also reads the decks and the files that they
  #   link to: the guides, the glossary and the READMEs.
  # - deploy/compose checks the tables of docs/guide/*/capture.md and
  #   docs/guide/*/README.md against compose.yaml. A change of one of
  #   them runs that test in the compose-docs job.
  # - The end-to-end script of a scenario runs the display filters of its
  #   English guide against its capture; the docs job checks that both
  #   languages show the same filters. A change of one of those guides
  #   runs the end-to-end jobs whose script reads it, which find the name
  #   of the guide, between spaces, in the guides output.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      compose_docs: ${{ steps.diff.outputs.compose_docs }}
      guides: ${{ steps.diff.outputs.guides }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch, or a base the clone does not have, gets every job.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rename lists both paths, so that code moved into slides/ or
          # docs/, or a guide moved away, still counts where it was.
          files=$(git diff --name-only --no-renames "$BASE" HEAD)
          code=$(echo "$files" | grep -Ev '\.md$|^docs/|^LICENSE|^NOTICE$|^slides/' | head -n 1 || true)
          echo "first file of code: ${code:-none}"
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          compose=$(echo "$files" | grep -E '^docs/guide/(en|ja)/(capture|README)\.md$' | head -n 1 || true)
          echo "compose_docs=$([ -n "$compose" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          guides=$(echo "$files" | grep -E '^docs/guide/en/(capture|interconnect|mmtel|mrf|oss|sms|volte)\.md$' |
            sed 's|^docs/guide/en/||; s|\.md$||' | tr '\n' ' ' || true)
          echo "guides whose filters a scenario runs: ${guides:-none}"
          echo "guides= $guides" >> "$GITHUB_OUTPUT"

  docs:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so that the check of the commit messages
      # finds the merge base of the pull request.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_links.py
      - name: what learners read does not point into the development records
        run: python scripts/check_learner_text.py
      - name: every simplification in the code is in a table that learners read
        run: python scripts/check_simplified.py
      - name: every abbreviation in the guides is in the glossary
        run: python scripts/check_glossary.py
      - name: the Japanese headings are plain phrases and say シーケンス図
        run: python scripts/check_japanese.py
      - name: the display filters of a guide are the same in both languages, and a scenario runs them
        run: python scripts/guide_filters.py --check
      - name: what the decks had at the baseline of the book is in the decks or where the record says it went
        run: python scripts/check_deck_content.py docs/design/book-migration.md
      - name: the tests of the scripts
        run: python -m unittest discover -s scripts -p "*_test.py"
      # The commits of the pull request itself, not the merge commit that
      # the checkout builds; a push to main adds commits already checked.
      - name: the commit messages have the form of the project and link to no conversation
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_commit_messages.py "$BASE" "$HEAD"

  go:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The stores of the nodes run their tests against a Valkey server
    # too when KVSTORE_VALKEY_ADDR names one. With it set, a test that
    # cannot reach the server fails instead of being skipped.
    services:
      valkey:
        image: valkey/valkey:9.0.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    # The tests of the slide generator validate every part of the pptx
    # it writes against the schemas of ECMA-376, with the xmllint that
    # PPTX_XMLLINT names. With it set, a test that cannot run xmllint
    # fails instead of being skipped.
    env:
      KVSTORE_VALKEY_ADDR: 127.0.0.1:6379
      PPTX_XMLLINT: xmllint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # go vet and go test compile the test files too, so only a plain
      # build notices code that leans on a helper from a _test.go file.
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  # The go job runs the tests of the slide generator with the others.
  # This job runs only them, when no code changed. Like the go job,
  # it validates the pptx against the schemas of ECMA-376 with xmllint.
  slide-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'false'
    env:
      PPTX_XMLLINT: xmllint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: gofmt
        run: test -z "$(gofmt -l slides)" || { gofmt -l slides; exit 1; }
      # As in the go job: only a plain build notices code that leans on a
      # helper from a _test.go file.
      - run: go build ./slides/...
      - run: go vet ./slides/...
      - run: go test -race ./slides/...

  # The go job runs this test with the others; this job runs it alone
  # when a change of documents touches the guides that it reads.
  compose-docs:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'false' && needs.changes.outputs.compose_docs == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./deploy/compose/...

  web-lab:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: web/lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build

  # The end-to-end jobs build their own images and take nothing from the
  # go job, so they start beside it rather than after it. all-passed
  # still needs every job.
  e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-diameter.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diameter-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose down --rmi all -v --remove-orphans

  e2e-registration:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-registration.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registration-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  # The OAM: it reads the state of every node of the inventory,
  # provisions a file of test subscribers in bulk through the HSS, backs
  # the subscriptions up and puts them back, and one of the subscribers
  # it created registers.
  e2e-oam:
    runs-on: ubuntu-latest
    needs: [changes, web-oam]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-oam.sh
      # The file of subscribers is not uploaded: it holds the password
      # of each of them, test values though they are.
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oam-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  # Fault supervision towards an OSS: the OSS stand-in subscribes at the
  # OAM, reads the AlarmList with a filter and acknowledges an alarm, and
  # takes the notifications of a node that stops answering and of the
  # alarms that a drain of the HSS raises and clears.
  e2e-fm:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || contains(needs.changes.outputs.guides, ' oss ')
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-fm.sh
      - name: upload the capture and the ladder of the OSS
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fm-capture
          path: |
            captures/*.pcap
            e2e-out/fm-ladder.txt
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile oss down --rmi all -v --remove-orphans

  # The admission policy of the HSS, which the script narrows on the
  # maintenance API of the HSS node once the deployment is up.
  e2e-admission:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-admission.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admission-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-call:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-call.sh
      - name: upload the capture and the recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: call-capture
          path: |
            captures/*.pcap
            captures/*.wav
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-lab:
    runs-on: ubuntu-latest
    needs: [changes, web-lab]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-lab.sh
      - name: upload the capture and the Lab's view
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-capture
          path: |
            captures/*.pcap
            e2e-out/lab-messages.json
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue --profile phones down --rmi all -v --remove-orphans

  e2e-sms:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || contains(needs.changes.outputs.guides, ' sms ') || contains(needs.changes.outputs.guides, ' capture ')
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-sms.sh
      - name: upload the capture and the ladder of the short messages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sms-capture
          path: |
            captures/*.pcap
            e2e-out/sms-ladder.txt
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-volte:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || contains(needs.changes.outputs.guides, ' volte ')
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-volte.sh
      - name: upload the capture, the recordings, the ladder and the logs of the UEs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: volte-capture
          path: |
            captures/*.pcap
            captures/volte-*.amr
            e2e-out/volte-ladder.txt
            e2e-out/*.log
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue --profile volte down --rmi all -v --remove-orphans

  # IPsec ESP on the signalling of IMS AKA, which deploy/esp/esp.yaml
  # turns on. It is not the default, so this job says whether the
  # deployment with ESP works on the Linux of a runner.
  e2e-esp:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-esp.sh
      - name: upload the capture, the kernel's security associations and the logs of the UEs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esp-capture
          path: |
            captures/*.pcap
            e2e-out/esp-xfrm.txt
            e2e-out/*.log
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose -f compose.yaml -f deploy/esp/esp.yaml --profile volte down --rmi all -v --remove-orphans

  # The same deployment with the confidentiality policy of the P-CSCF on
  # top, which encrypts the signalling. It also says whether the keys
  # that the P-CSCF writes let tshark decrypt what it captured.
  e2e-esp-encryption:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-esp-encryption.sh
      - name: upload the capture, its ESP SAs table, the kernel's security associations and the logs of the UEs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esp-encryption-capture
          path: |
            captures/*.pcap
            captures/esp_sa
            e2e-out/esp-encryption-xfrm.txt
            e2e-out/*.log
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose -f compose.yaml -f deploy/esp/esp.yaml -f deploy/esp/encryption.yaml --profile volte down --rmi all -v --remove-orphans

  e2e-mmtel:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || contains(needs.changes.outputs.guides, ' mmtel ')
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-mmtel.sh
      - name: upload the capture, the ladder and the logs of the UEs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mmtel-capture
          path: |
            captures/*.pcap
            e2e-out/mmtel-ladder.txt
            e2e-out/ims-practice-*.log
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-mrf:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || contains(needs.changes.outputs.guides, ' mrf ')
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-mrf.sh
      - name: upload the capture, the ladder and the logs of the UEs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mrf-capture
          path: |
            captures/*.pcap
            captures/mrf-cat-received.raw
            e2e-out/mrf-ladder.txt
            e2e-out/mrf-*.log
            e2e-out/ims-practice-*.log
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue --profile phones down --rmi all -v --remove-orphans

  e2e-interconnect:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || contains(needs.changes.outputs.guides, ' interconnect ')
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-interconnect.sh
      - name: upload the captures of network A, network B and the link between them
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interconnect-capture
          path: |
            captures/*.pcap
            captures/b/*.pcap
            captures/nni/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: >-
          docker compose -p ims-practice-interconnect -f compose.yaml -f deploy/interconnect/compose.yaml
          --profile ue down --rmi all -v --remove-orphans

  # The fault agent on top of the stack, which is the only deployment
  # that starts the fault role.
  e2e-fault:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-fault.sh
      - name: clean up
        if: always()
        run: >-
          docker compose -f compose.yaml -f deploy/chaos/chaos.yaml -f deploy/chaos/agent.yaml
          --profile chaos down --rmi all -v --remove-orphans

  # The scenario of e2e-call on the deployment whose P-CSCF controls the
  # media relay over H.248 (deploy/h248), with the H.248 of those calls
  # read out of the same capture. The script sets COMPOSE_FILE itself;
  # the clean-up step needs the same files to find the containers.
  e2e-h248:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      COMPOSE_FILE: compose.yaml:deploy/h248/h248.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-h248.sh
      - name: upload the capture and the recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h248-capture
          path: |
            captures/*.pcap
            captures/*.wav
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  # Prometheus and Grafana beside the Compose project
  # (deploy/observability): the counts of registrations of the S-CSCF
  # and of the P-CSCF reach Prometheus, that of the S-CSCF Grafana too,
  # a call gives the I-CSCF its terminating session establishment to
  # count, and the HSS counts what it holds and who is registered. The
  # scripts of this job and of the three e2e-maintenance jobs below set
  # COMPOSE_FILE themselves; the clean-up step needs the same files to
  # find the containers.
  e2e-observability:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      COMPOSE_FILE: compose.yaml:deploy/observability/compose.observability.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-observability.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  # The maintenance API on the same deployment takes a node out of
  # service and back. The nodes are split over three jobs that do not
  # depend on one another, so that their waits run side by side: those
  # of registrations and calls (the CSCFs, the MMTel AS, the MRFC, the
  # media relay and the MRFP), those of short messages (the IP-SM-GW and
  # the SC, to which the IP-SM-GW connects again only after Tc, 30 s),
  # and the HSS, whose peers raise their alarms only after Tc and connect
  # again after another.
  e2e-maintenance-sip:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      COMPOSE_FILE: compose.yaml:deploy/observability/compose.observability.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-maintenance-sip.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-sip-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-maintenance-sms:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      COMPOSE_FILE: compose.yaml:deploy/observability/compose.observability.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-maintenance-sms.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-sms-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-maintenance-hss:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      COMPOSE_FILE: compose.yaml:deploy/observability/compose.observability.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-maintenance-hss.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-hss-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  # The scenarios of e2e-registration, e2e-call, e2e-sms and e2e-mrf on
  # the deployment whose roles keep the state of their users in the
  # shared store (deploy/redundancy). The scripts are the same: Compose reads
  # the files of the project from COMPOSE_FILE, so the overlay needs no
  # scenario of its own, and the flows must come out of the capture as
  # they do with the state in the memory of each process.
  e2e-redundancy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || contains(needs.changes.outputs.guides, ' sms ') || contains(needs.changes.outputs.guides, ' mrf ') || contains(needs.changes.outputs.guides, ' capture ')
    env:
      COMPOSE_FILE: compose.yaml:deploy/redundancy/redundancy.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-registration.sh
      # Without this step the scenarios would also pass with every role
      # on the memory of its own process, which is what a node does when
      # it reads no store section.
      - name: the S-CSCF keeps its registrations in the store
        run: |
          # A UE that stays registered, so that the registration is in
          # the store while valkey-cli looks for it: the scenario above
          # leaves its own UE deregistered.
          docker compose run --no-deps -d --name ims-practice-ue-store ue register >/dev/null
          registered=
          for i in $(seq 1 30); do
            if grep -q '"msg":"registered"' <<<"$(docker logs ims-practice-ue-store 2>/dev/null)"; then
              registered=yes
              break
            fi
            sleep 1
          done
          if [ -z "$registered" ]; then
            echo "the UE did not register within 30 s"
            docker logs ims-practice-ue-store
            docker rm -f ims-practice-ue-store >/dev/null
            exit 1
          fi
          keys="$(docker compose exec -T valkey valkey-cli --scan --pattern 'ims:*' | tr -d '\r' | sort)"
          docker rm -f ims-practice-ue-store >/dev/null
          echo "$keys"
          impi=001010000000001@ims.mnc001.mcc001.3gppnetwork.org
          grep -Fqx "ims:scscf:registration:$impi" <<<"$keys" ||
            { echo "no registration of $impi in the store"; exit 1; }
      # Each scenario starts from an empty store, as it starts from
      # nodes that hold nothing: down -v deletes the volume of the
      # store. The images stay, so the next scenario builds nothing.
      - name: down between the scenarios
        run: docker compose --profile ue down -v --remove-orphans
      - run: scripts/e2e-call.sh
      - name: down again
        run: docker compose --profile ue down -v --remove-orphans
      - run: scripts/e2e-sms.sh
      - name: down before the MRF
        run: docker compose --profile ue down -v --remove-orphans
      # The announcement, the CAT and the conference, through the MRFC
      # and the MRFP of deploy/redundancy.
      - run: scripts/e2e-mrf.sh
      # Without this step e2e-mrf would also pass with the MRFC and the
      # MRFP on the memory of their own processes. The capture holds what
      # the nodes ask of the store (172.28.0.5): the MRFC writes the media
      # of each conference under ims:mrfc:conference:, and the MRFP each
      # context of an announcement or a conference under
      # ims:agw:<relay>:context:.
      - name: the MRFC and the MRFP keep their state in the store
        run: |
          pcap="$(docker compose exec -T capture sh -c 'ls -t /captures/ims-*.pcap | head -n 1' | tr -d '\r')"
          asked() {
            docker compose exec -T capture tshark -r "$pcap" \
              -Y "ip.src == $1 && ip.dst == 172.28.0.5 && tcp.dstport == 6379 && frame contains \"$2\"" | tr -d '\r' | grep -c . || true
          }
          mrfc="$(asked 172.28.0.85 ims:mrfc:conference:)"
          mrfp="$(asked 172.28.0.86 :context:)"
          echo "segments to the store about a conference from the MRFC: $mrfc, about a context from the MRFP: $mrfp"
          [ "$mrfc" -gt 0 ] || { echo "the MRFC never asked the store about a conference"; exit 1; }
          [ "$mrfp" -gt 0 ] || { echo "the MRFP never asked the store about a context"; exit 1; }
      - name: upload the captures and the ladders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redundancy-capture
          path: |
            captures/*.pcap
            captures/*.wav
            e2e-out/sms-ladder.txt
            e2e-out/mrf-ladder.txt
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue --profile phones down --rmi all -v --remove-orphans

  cloud:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir: [deploy/cloud/modules/ims-network, deploy/cloud/aws, deploy/cloud/azure]
    env:
      TOFU_VERSION: 1.13.0
      TOFU_SHA256: ad494034a03aaa66d93fc1c2c164d01bedf21b44cfb8b616182cb69424a67672
      TF_IN_AUTOMATION: "1"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v7
      - name: install OpenTofu
        run: |
          mkdir -p "$RUNNER_TEMP/tofu"
          cd "$RUNNER_TEMP/tofu"
          zip="tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl -fsSLo "$zip" "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/$zip"
          echo "$TOFU_SHA256  $zip" | sha256sum -c
          unzip -q "$zip" tofu
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - name: cache the providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.dir)) }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: tofu -chdir="${{ matrix.dir }}" fmt -check -recursive -diff
      - run: tofu -chdir="${{ matrix.dir }}" init -backend=false -input=false -lockfile=readonly
      - run: tofu -chdir="${{ matrix.dir }}" validate
      - run: tofu -chdir="${{ matrix.dir }}" test

  kustomize:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    # KUBECTL_SHA256 is the content of
    # https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl.sha256,
    # written here rather than downloaded beside the binary, as in the
    # kind workflow.
    env:
      KUBECTL_VERSION: v1.37.2
      KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KUBERNETES_VERSION: 1.37.2
    steps:
      - uses: actions/checkout@v7
      - name: install kubectl and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSLo kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  kubectl" | sha256sum -c
          chmod +x kubectl
          tgz=kubeconform-linux-amd64.tar.gz
          curl -fsSLo "$tgz" "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/$tgz"
          echo "$KUBECONFORM_SHA256  $tgz" | sha256sum -c
          tar -xzf "$tgz" kubeconform
          rm "$tgz"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: deploy/k8s/check-overlays.sh --require-kubeconform

  web-oam:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: web/oam
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build

  # The one check that the protection of main requires. It passes when no
  # job failed or was cancelled; the jobs that a change to documents
  # skips count as passed.
  all-passed:
    runs-on: ubuntu-latest
    needs: [changes, docs, go, slide-tests, compose-docs, web-lab, web-oam, e2e, e2e-registration, e2e-oam, e2e-fm, e2e-admission, e2e-call, e2e-lab, e2e-sms, e2e-volte, e2e-esp, e2e-esp-encryption, e2e-mmtel, e2e-mrf, e2e-interconnect, e2e-h248, e2e-observability, e2e-maintenance-sip, e2e-maintenance-sms, e2e-maintenance-hss, e2e-redundancy, e2e-fault, cloud, kustomize]
    if: always()
    steps:
      - name: no job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
