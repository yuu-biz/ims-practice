name: ci

# A newer push to the same branch cancels the run of an older one.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A change that touches only documents needs the checks of the docs job
  # and nothing else: no test reads the Markdown files or the licences,
  # except the tables of docs/guide/*/capture.md and docs/guide/*/README.md,
  # which deploy/compose checks against compose.yaml.
  # The other jobs are skipped then, and a skipped job counts as passed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch, or a base the clone does not have, gets every job.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE" HEAD |
            grep -Ev '\.md$|^docs/|^LICENSE|^NOTICE$' | head -n 1 || true)
          if [ -z "$code" ]; then
            code=$(git diff --name-only "$BASE" HEAD |
              grep -E '^docs/guide/(en|ja)/(capture|README)\.md$' | head -n 1 || true)
          fi
          echo "first file that is not a document: ${code:-none}"
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_links.py
      - name: what learners read does not point into the development records
        run: python scripts/check_learner_text.py
      - name: every simplification in the code is in a table that learners read
        run: python scripts/check_simplified.py

  go:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The stores of the nodes run their tests against a Valkey server
    # too when KVSTORE_VALKEY_ADDR names one. With it set, a test that
    # cannot reach the server fails instead of being skipped.
    services:
      valkey:
        image: valkey/valkey:9.0.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      KVSTORE_VALKEY_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # go vet and go test compile the test files too, so only a plain
      # build notices code that leans on a helper from a _test.go file.
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  web-lab:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: web/lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-diameter.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diameter-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose down --rmi all -v --remove-orphans

  e2e-registration:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-registration.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registration-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-call:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-call.sh
      - name: upload the capture and the recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: call-capture
          path: |
            captures/*.pcap
            captures/*.wav
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-lab:
    runs-on: ubuntu-latest
    needs: [changes, go, web-lab]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-lab.sh
      - name: upload the capture and the Lab's view
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-capture
          path: |
            captures/*.pcap
            e2e-out/lab-messages.json
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue --profile sim down --rmi all -v --remove-orphans

  e2e-sms:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-sms.sh
      - name: upload the capture and the ladder of the short messages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sms-capture
          path: |
            captures/*.pcap
            e2e-out/sms-ladder.txt
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-volte:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-volte.sh
      - name: upload the capture, the recordings, the ladder and the logs of the UEs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: volte-capture
          path: |
            captures/*.pcap
            captures/volte-*.amr
            e2e-out/volte-ladder.txt
            e2e-out/*.log
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue --profile volte down --rmi all -v --remove-orphans

  e2e-mmtel:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-mmtel.sh
      - name: upload the capture, the ladder and the logs of the UEs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mmtel-capture
          path: |
            captures/*.pcap
            e2e-out/mmtel-ladder.txt
            e2e-out/ims-practice-*.log
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  e2e-mrf:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-mrf.sh
      - name: upload the capture, the ladder and the logs of the UEs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mrf-capture
          path: |
            captures/*.pcap
            captures/mrf-cat-received.raw
            e2e-out/mrf-ladder.txt
            e2e-out/mrf-*.log
            e2e-out/ims-practice-*.log
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue --profile sim down --rmi all -v --remove-orphans

  e2e-interconnect:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-interconnect.sh
      - name: upload the captures of network A, network B and the link between them
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interconnect-capture
          path: |
            captures/*.pcap
            captures/peer/*.pcap
            captures/nni/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: >-
          docker compose -p ims-practice-interconnect -f compose.yaml -f deploy/interconnect/compose.yaml
          --profile ue down --rmi all -v --remove-orphans

  # The fault agent on top of the stack, which is the only deployment
  # that starts the fault role.
  e2e-fault:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-fault.sh
      - name: clean up
        if: always()
        run: >-
          docker compose -f compose.yaml -f deploy/chaos/chaos.yaml -f deploy/chaos/agent.yaml
          down --rmi all -v --remove-orphans

  # The scenario of e2e-call on the deployment whose P-CSCF controls the
  # media relay over H.248 (deploy/h248), with the H.248 of those calls
  # read out of the same capture. The script sets COMPOSE_FILE itself;
  # the clean-up step needs the same files to find the containers.
  e2e-h248:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    env:
      COMPOSE_FILE: compose.yaml:deploy/h248/h248.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-h248.sh
      - name: upload the capture and the recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: h248-capture
          path: |
            captures/*.pcap
            captures/*.wav
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  # Prometheus and Grafana beside the Compose project
  # (deploy/observability): the S-CSCF's count of registrations reaches
  # both, and the maintenance API of the S-CSCF takes it out of service
  # and back. The script sets COMPOSE_FILE itself; the clean-up step
  # needs the same files to find the containers.
  e2e-observability:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    env:
      COMPOSE_FILE: compose.yaml:deploy/observability/compose.observability.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-observability.sh
      - name: upload the capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-capture
          path: captures/*.pcap
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  # The scenarios of e2e-registration, e2e-call and e2e-sms on the
  # deployment whose roles keep the state of their users in the shared
  # store (deploy/redundancy). The scripts are the same: Compose reads
  # the files of the project from COMPOSE_FILE, so the overlay needs no
  # scenario of its own, and the flows must come out of the capture as
  # they do with the state in the memory of each process.
  e2e-redundancy:
    runs-on: ubuntu-latest
    needs: [changes, go]
    if: needs.changes.outputs.code == 'true'
    env:
      COMPOSE_FILE: compose.yaml:deploy/redundancy/redundancy.yaml
      COMPOSE_PATH_SEPARATOR: ":"
    steps:
      - uses: actions/checkout@v7
      - run: scripts/e2e-registration.sh
      # Without this step the scenarios would also pass with every role
      # on the memory of its own process, which is what a node does when
      # it reads no store section.
      - name: the S-CSCF keeps its registrations in the store
        run: |
          # A UE that stays registered, so that the registration is in
          # the store while valkey-cli looks for it: the scenario above
          # leaves its own UE deregistered.
          docker compose run --no-deps -d --name ims-practice-ue-store ue register >/dev/null
          registered=
          for i in $(seq 1 30); do
            if grep -q '"msg":"registered"' <<<"$(docker logs ims-practice-ue-store 2>/dev/null)"; then
              registered=yes
              break
            fi
            sleep 1
          done
          if [ -z "$registered" ]; then
            echo "the UE did not register within 30 s"
            docker logs ims-practice-ue-store
            docker rm -f ims-practice-ue-store >/dev/null
            exit 1
          fi
          keys="$(docker compose exec -T valkey valkey-cli --scan --pattern 'ims:*' | tr -d '\r' | sort)"
          docker rm -f ims-practice-ue-store >/dev/null
          echo "$keys"
          impi=001010000000001@ims.mnc001.mcc001.3gppnetwork.org
          grep -Fqx "ims:scscf:registration:$impi" <<<"$keys" ||
            { echo "no registration of $impi in the store"; exit 1; }
      # Each scenario starts from an empty store, as it starts from
      # nodes that hold nothing: down -v deletes the volume of the
      # store. The images stay, so the next scenario builds nothing.
      - name: down between the scenarios
        run: docker compose --profile ue down -v --remove-orphans
      - run: scripts/e2e-call.sh
      - name: down again
        run: docker compose --profile ue down -v --remove-orphans
      - run: scripts/e2e-sms.sh
      - name: upload the captures and the ladder of the short messages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redundancy-capture
          path: |
            captures/*.pcap
            captures/*.wav
            e2e-out/sms-ladder.txt
          if-no-files-found: warn
      - name: clean up
        if: always()
        run: docker compose --profile ue down --rmi all -v --remove-orphans

  cloud:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir: [deploy/cloud/modules/ims-network, deploy/cloud/aws, deploy/cloud/azure]
    env:
      TOFU_VERSION: 1.13.0
      TOFU_SHA256: ad494034a03aaa66d93fc1c2c164d01bedf21b44cfb8b616182cb69424a67672
      TF_IN_AUTOMATION: "1"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v7
      - name: install OpenTofu
        run: |
          mkdir -p "$RUNNER_TEMP/tofu"
          cd "$RUNNER_TEMP/tofu"
          zip="tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl -fsSLo "$zip" "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/$zip"
          echo "$TOFU_SHA256  $zip" | sha256sum -c
          unzip -q "$zip" tofu
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - name: cache the providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles(format('{0}/.terraform.lock.hcl', matrix.dir)) }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: tofu -chdir="${{ matrix.dir }}" fmt -check -recursive -diff
      - run: tofu -chdir="${{ matrix.dir }}" init -backend=false -input=false -lockfile=readonly
      - run: tofu -chdir="${{ matrix.dir }}" validate
      - run: tofu -chdir="${{ matrix.dir }}" test

  kustomize:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    env:
      KUBECTL_VERSION: v1.37.2
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KUBERNETES_VERSION: 1.37.2
    steps:
      - uses: actions/checkout@v7
      - name: install kubectl and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSLo kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum -c
          chmod +x kubectl
          tgz=kubeconform-linux-amd64.tar.gz
          curl -fsSLo "$tgz" "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/$tgz"
          echo "$KUBECONFORM_SHA256  $tgz" | sha256sum -c
          tar -xzf "$tgz" kubeconform
          rm "$tgz"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: deploy/k8s/check-overlays.sh --require-kubeconform

  web-oam:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: web/oam
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build

  # The one check that the protection of main requires. It passes when no
  # job failed or was cancelled; the jobs that a change to documents
  # skips count as passed.
  all-passed:
    runs-on: ubuntu-latest
    needs: [changes, docs, go, web-lab, web-oam, e2e, e2e-registration, e2e-call, e2e-lab, e2e-sms, e2e-volte, e2e-mmtel, e2e-mrf, e2e-interconnect, e2e-h248, e2e-observability, e2e-redundancy, e2e-fault, cloud, kustomize]
    if: always()
    steps:
      - name: no job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
