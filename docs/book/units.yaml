  - id: registration-subscriptions
    question:
      ja: 誰が登録の状態を購読し、NOTIFY は何を伝えるのか
      en: Who subscribes to the registration state, and what does a NOTIFY say
    setup: deploy/compose, a softphone that registers with SIP Digest; the P-CSCF, the UE and the IP-SM-GW subscribe to the reg event at the S-CSCF
    chapter: registration-lifecycle
    scenes: [04-registration/pcscf-subscribe, 04-registration/ue-subscribe]
    code:
      - internal/scscf/regevent.go:authorizedSubscriber
      - internal/scscf/regevent.go:endRegistration
      - internal/scscf/scscf.go:accept
      - internal/pcscf/regevent.go:removedByTheNetwork
    tests:
      - internal/scscf/regevent_test.go:TestRegEventFollowsTheRegistration
      - internal/scscf/regevent_test.go:TestRegEventSubscriptionsThatAreRefused
      - internal/pcscf/regevent_test.go:TestPCSCFSubscribesToTheRegEventAndEndsTheAssociation
      - internal/pcscf/regevent_test.go:TestRemovedByTheNetwork
    standards:
      - TS 24.229 V18.11.0 5.1.1.3, 5.1.1.4.1, 5.2.3, 5.2.5.2, 5.2.6.4.5, 5.4.2.1.1, 5.4.2.1.2
      - TS 29.228 V18.0.0 6.1.4
      - RFC 3680 4.4, 4.5
      - RFC 6665 4.4.1
    evidence: [code, test]
    verified: bfb57a7611a0632a51f56ceba892141f43d22d96
  - id: registration-third-party
    question:
      ja: S-CSCF はなぜアプリケーションサーバーにも REGISTER を送り、IP-SM-GW はそれで何をするのか
      en: Why does the S-CSCF send a REGISTER to the application server too, and what does the IP-SM-GW do with it
    setup: deploy/compose; the iFC of every REGISTER names the IP-SM-GW with SESSION_CONTINUED
