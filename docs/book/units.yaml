      - internal/scscf/regevent_test.go:TestRegistrationTerminationByTheHSS
      - internal/scscf/regevent_test.go:TestRegistrationTerminationReasons
      - internal/ue/regevent_test.go:TestRegEventReportsTheExpiryThroughTheWholeIMS
