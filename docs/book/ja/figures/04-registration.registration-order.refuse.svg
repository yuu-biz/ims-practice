<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 595" width="705" height="595" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>遅れて届いた登録の解除: 500 で断り、登録を残す</title>
<rect width="705" height="595" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="18" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="102" y="47.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="102" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">ホーム網の入口</text><rect x="318" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="402" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="402" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">認証と登録</text><rect x="318" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="402" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">HSS</text><text x="402" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">加入者のデータ</text><rect x="312.91" y="252" width="178.17" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="402" y="271.5" font-size="13.5" fill="#57606A" text-anchor="middle">登録を保存している</text><line x1="184.62" y1="85" x2="349.62" y2="173" stroke="#84A7BF" stroke-width="1.25"/><polygon points="349.62,173 344.04,172.85 346.39,168.44" fill="#84A7BF"/><text x="254.02" y="39.8" font-size="15" fill="#57606A" text-anchor="middle">REGISTER</text><text x="254.02" y="54.8" font-size="11.5" fill="#57606A" text-anchor="middle">(遅れた解除) SIP</text><rect x="335.41" y="138" width="133.17" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="402" y="157.5" font-size="13.5" fill="#57606A" text-anchor="middle">順序を比べる</text><line x1="319.38" y1="175" x2="154.38" y2="87" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="154.38,87 161.92,87.2 158.74,93.15" fill="#1F5F8B"/><text x="216.54" y="166.62" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">500</text><text x="216.54" y="181.62" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><rect x="496" y="195" width="159" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="575.5" y="214.5" font-size="13.5" fill="#57606A" text-anchor="middle">登録をそのまま残す</text><text x="0" y="337.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">500 (SIP)  S-CSCF → I-CSCF</text><rect x="0" y="345" width="282.66" height="48" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="363.75" font-size="16" fill="#57606A" text-anchor="start">応答のコード</text><rect x="282.66" y="345" width="390.34" height="48" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="286.66" y="363.75" font-size="16" fill="#1F2328" text-anchor="start">RFC 3261 10.3 はコードを定めない。この実装は</text><text x="286.66" y="384.75" font-size="16" fill="#1F2328" text-anchor="start">500</text><text x="0" y="418.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">S-CSCF: 登録をそのまま残す</text><rect x="0" y="426" width="282.66" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="444.75" font-size="16" fill="#57606A" text-anchor="start">Contact と期限</text><rect x="282.66" y="426" width="390.34" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="286.66" y="444.75" font-size="16" fill="#1F2328" text-anchor="start">変えない</text><rect x="0" y="453" width="282.66" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="471.75" font-size="16" fill="#57606A" text-anchor="start">CSeq</text><rect x="282.66" y="453" width="390.34" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="286.66" y="471.75" font-size="16" fill="#1F2328" text-anchor="start">5 のまま</text><rect x="0" y="480" width="282.66" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="498.75" font-size="16" fill="#57606A" text-anchor="start">HSS</text><rect x="282.66" y="480" width="390.34" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="286.66" y="498.75" font-size="16" fill="#1F2328" text-anchor="start">解除の SAR を送らない</text></g>
<line x1="16" y1="554" x2="46" y2="554" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="558.5" font-size="13" fill="#1D2B36">SIP</text>
<text x="16" y="582" font-size="13" fill="#57606A">考え方を説明するための例です。この構成の値やキャプチャではありません。</text>
</svg>
