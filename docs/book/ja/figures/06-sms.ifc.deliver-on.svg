<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1436 528.45" width="1436" height="528.45" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>S-CSCF が IP-SM-GW を選ぶしくみ: MESSAGE はそのまま UE 2 へ</title>
<rect width="1436" height="528.45" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="102" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE 1</text><text x="102" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">送信者</text><rect x="18" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="102" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE 2</text><text x="102" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">受信者</text><rect x="318" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="402" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="402" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">最初の中継点</text><rect x="618" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="702" y="47.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="702" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">ホーム網の入口</text><rect x="618" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="702" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="702" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">iFC を評価する</text><rect x="918" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1002" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">HSS</text><text x="1002" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">加入者のデータ</text><rect x="918" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1002" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">IP-SM-GW</text><text x="1002" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">SMS の AS</text><rect x="1218" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1302" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">SC</text><text x="1302" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">預かって配達する</text><line x1="710" y1="85" x2="710" y2="173" stroke="#84A7BF" stroke-width="1.25"/><polygon points="710,173 707.5,168 712.5,168" fill="#84A7BF"/><text x="769.06" y="126.5" font-size="15" fill="#57606A" text-anchor="middle">MESSAGE</text><text x="769.06" y="141.5" font-size="11.5" fill="#57606A" text-anchor="middle">(3 通目) SIP</text><rect x="592" y="252" width="220" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="702" y="271.5" font-size="13.5" fill="#57606A" text-anchor="middle">着信側の条件と連絡先を調べる</text><line x1="615" y1="218" x2="491" y2="218" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="491,218 497.75,214.62 497.75,221.38" fill="#1F5F8B"/><text x="525.72" y="274.73" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">MESSAGE</text><text x="525.72" y="289.73" font-size="11.5" fill="#57606A" text-anchor="middle">(3 通目) SIP</text><text x="0" y="351.7" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">S-CSCF: 着信側の条件と連絡先を調べる</text><rect x="0" y="359.45" width="589.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="378.2" font-size="16" fill="#57606A" text-anchor="start">優先度 2</text><rect x="589.68" y="359.45" width="814.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="593.68" y="378.2" font-size="16" fill="#1F2328" text-anchor="start">一致しない。P-Asserted-Identity が IP-SM-GW</text><rect x="0" y="386.45" width="589.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="405.2" font-size="16" fill="#57606A" text-anchor="start">Accept-Contact</text><rect x="589.68" y="386.45" width="814.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="593.68" y="405.2" font-size="16" fill="#1F2328" text-anchor="start">UE 2 の連絡先は +g.3gpp.smsip を持つので残る</text><rect x="0" y="413.45" width="589.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="432.2" font-size="16" fill="#57606A" text-anchor="start">Request-Disposition</text><rect x="589.68" y="413.45" width="814.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="593.68" y="432.2" font-size="16" fill="#1F2328" text-anchor="start">no-fork 連絡先を 1 つだけ選ぶ</text></g>
<line x1="16" y1="487.45" x2="46" y2="487.45" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="491.95" font-size="13" fill="#1D2B36">SIP</text>
<text x="16" y="515.45" font-size="13" fill="#57606A">この構成の動きを手順書から描いた模式図です。キャプチャそのものではありません。</text>
