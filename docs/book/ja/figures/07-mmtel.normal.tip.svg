<g transform="translate(16 16)"><rect x="18" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="102" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">UE 1</text><text x="102" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">発信者</text><rect x="18" y="338" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="102" y="367.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE 2</text><text x="102" y="385.75" font-size="12.5" fill="#57606A" text-anchor="middle">サービスを設定する</text><rect x="318" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="402" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="402" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">識別子を示し、隠す</text><rect x="618" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="702" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="702" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">ホーム網の入口</text><rect x="918" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1002" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="1002" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">iFC で AS に送る</text><rect x="1218" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1302" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">HSS</text><text x="1302" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">iFC と利用者の設定</text><rect x="1218" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1302" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">MMTel AS</text><text x="1302" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">UE 1 のサービス</text><rect x="1218" y="338" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1302" y="367.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">MMTel AS</text><text x="1302" y="385.75" font-size="12.5" fill="#57606A" text-anchor="middle">UE 2 のサービス</text><rect x="305.41" y="252" width="193.17" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="402" y="271.5" font-size="13.5" fill="#57606A" text-anchor="middle">誰が応答したかを示す</text><line x1="315" y1="218" x2="191" y2="218" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="191,218 197.75,214.62 197.75,221.38" fill="#1F5F8B"/><text x="253" y="246.72" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">200 OK</text><text x="253" y="261.73" font-size="11.5" fill="#57606A" text-anchor="middle">(C1) SIP</text><text x="0" y="457.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">200 OK (SIP)  P-CSCF → UE 1</text><rect x="0" y="465" width="591.61" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="483.75" font-size="16" fill="#57606A" text-anchor="start">P-Asserted-Identity</text><rect x="591.61" y="465" width="816.98" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="595.61" y="483.75" font-size="16" fill="#1F2328" text-anchor="start">&lt;sip:+12025550102@…&gt;。これが TIP</text></g>
<line x1="16" y1="539" x2="46" y2="539" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="543.5" font-size="13" fill="#1D2B36">SIP</text>
<text x="16" y="567" font-size="13" fill="#57606A">この構成の動きを手順書から描いた模式図です。キャプチャそのものではありません。</text>
