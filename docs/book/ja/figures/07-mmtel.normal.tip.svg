<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440.59 580" width="1440.59" height="580" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>AS を通る通常の通話と TIP: 誰が応答したかが UE 1 に伝わる（TIP）</title>
