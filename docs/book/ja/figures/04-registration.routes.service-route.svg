<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160.68 460" width="1160.68" height="460" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>Path と Service-Route の使い分け: Service-Route は UE から出ていく要求の経路</title>
<rect width="1160.68" height="460" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="42.68" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="126.68" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">UE</text><text x="126.68" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">登録する端末</text><rect x="342.68" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="426.68" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="426.68" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">最初の中継点</text><rect x="642.68" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="726.68" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="726.68" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">ホーム網の入口</text><rect x="942.68" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="1026.68" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="1026.68" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">認証と登録</text><line x1="213.68" y1="202" x2="337.68" y2="202" stroke="#84A7BF" stroke-width="1.25"/><polygon points="337.68,202 332.68,204.5 332.68,199.5" fill="#84A7BF"/><text x="275.68" y="168.28" font-size="15" fill="#57606A" text-anchor="middle">INVITE</text><text x="275.68" y="183.28" font-size="11.5" fill="#57606A" text-anchor="middle">(発信) SIP</text><line x1="513.68" y1="202" x2="937.68" y2="202" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="937.68,202 930.93,205.38 930.93,198.62" fill="#1F5F8B"/><text x="725.68" y="168.28" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">INVITE</text><text x="725.68" y="183.28" font-size="11.5" fill="#57606A" text-anchor="middle">(発信) SIP</text><text x="0" y="337.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">INVITE (SIP)  P-CSCF → S-CSCF</text><rect x="0" y="345" width="474.05" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="363.75" font-size="16" fill="#57606A" text-anchor="start">Route</text><rect x="474.05" y="345" width="654.64" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="478.05" y="363.75" font-size="16" fill="#1F2328" text-anchor="start">P-CSCF が自分の値を取り除き、残りが Service-Route と一致するかを確かめる</text></g>
<line x1="16" y1="419" x2="46" y2="419" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="423.5" font-size="13" fill="#1D2B36">SIP</text>
<text x="16" y="447" font-size="13" fill="#57606A">この構成の動きを手順書から描いた模式図です。キャプチャそのものではありません。</text>
</svg>
