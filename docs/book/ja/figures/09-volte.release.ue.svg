<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 644.8" width="944" height="644.8" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>網が bearer を落とす: サービスを受ける端末にも BYE</title>
