<rect width="1160.68" height="574" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="42.68" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="126.68" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">UE</text><text x="126.68" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">登録する端末</text><rect x="342.68" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="426.68" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="426.68" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">最初の中継点</text><rect x="642.68" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="726.68" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="726.68" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">ホーム網の入口</text><rect x="942.68" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="1026.68" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="1026.68" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">認証と登録</text><rect x="959.67" y="252" width="134.03" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="1026.68" y="271.5" font-size="13.5" fill="#57606A" text-anchor="middle">Path を保存する</text><rect x="18" y="252" width="217.37" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="1.75"/><text x="126.68" y="271.5" font-size="13.5" fill="#1D2B36" text-anchor="middle" font-weight="bold">Service-Route を保存する</text><text x="0" y="337.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">S-CSCF: Path を保存する</text><rect x="0" y="345" width="474.05" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="363.75" font-size="16" fill="#57606A" text-anchor=