<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 553.6 731" width="553.6" height="731" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>ラボが推定する Cx と Rx: ラボが結び付ける</title>
<rect width="553.6" height="731" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="102" y="47.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="102" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">網の入口</text><rect x="318" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="402" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="402" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">登録とサービス</text><rect x="318" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="402" y="47.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">HSS</text><text x="402" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">加入者のデータ</text><rect x="318" y="338" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="402" y="367.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">Lab</text><text x="402" y="385.75" font-size="12.5" fill="#57606A" text-anchor="middle">ラボ。HEP を受ける</text><line x1="184.62" y1="85" x2="349.62" y2="173" stroke="#84A7BF" stroke-width="1.25"/><polygon points="349.62,173 344.04,172.85 346.39,168.44" fill="#84A7BF"/><text x="254.02" y="39.8" font-size="15" fill="#57606A" text-anchor="middle">REGISTER</text><text x="254.02" y="54.8" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><line x1="394" y1="175" x2="394" y2="87" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="394,87 396.5,92 391.5,92" fill="#C7A573"/><text x="347.25" y="128.5" font-size="15" fill="#57606A" text-anchor="middle">MAR</text><text x="347.25" y="143.5" font-size="11.5" fill="#57606A" text-anchor="middle">Cx</text><rect x="300.4" y="412" width="203.19" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="1.75"/><text x="402" y="431.5" font-size="13.5" fill="#1D2B36" text-anchor="middle" font-weight="bold">Cx を SIP に結び付ける</text><text x="0" y="497.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">Lab: Cx を SIP に結び付ける</text><rect x="0" y="505" width="219.07" height="69" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="523.75" font-size="16" fill="#57606A" text-anchor="start">Cx</text><rect x="219.07" y="505" width="302.53" height="69" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="223.07" y="523.75" font-size="16" fill="#1F2328" text-anchor="start">同じノードが 2 秒以内に最後に受け</text><text x="223.07" y="544.75" font-size="16" fill="#1F2328" text-anchor="start">取った、同じ利用者を指す SIP のリク</text><text x="223.07" y="565.75" font-size="16" fill="#1F2328" text-anchor="start">エスト</text><rect x="0" y="574" width="219.07" height="69" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="592.75" font-size="16" fill="#57606A" text-anchor="start">Rx</text><rect x="219.07" y="574" width="302.53" height="69" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="223.07" y="592.75" font-size="16" fill="#1F2328" text-anchor="start">P-CSCF がそのアドレスから最後に受</text><text x="223.07" y="613.75" font-size="16" fill="#1F2328" text-anchor="start">け取った SDP 付きのメッセージか</text><text x="223.07" y="634.75" font-size="16" fill="#1F2328" text-anchor="start">REGISTER</text></g>
<line x1="16" y1="690" x2="46" y2="690" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="694.5" font-size="13" fill="#1D2B36">SIP</text><line x1="100.18" y1="690" x2="130.18" y2="690" stroke="#9A5B00" stroke-width="2" stroke-dasharray="8 6"/><text x="136.18" y="694.5" font-size="13" fill="#1D2B36">Diameter</text>
<text x="16" y="718" font-size="13" fill="#57606A">この構成の動きを手順書から描いた模式図です。キャプチャそのものではありません。</text>
