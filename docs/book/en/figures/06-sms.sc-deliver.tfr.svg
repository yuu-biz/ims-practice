<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1461.11 541" width="1461.11" height="541" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>The SC starts the delivery (8): The SC hands it to the IP-SM-GW in a TFR (8)</title>
<rect width="1461.11" height="541" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="102" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE 1</text><text x="102" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">the sender</text><rect x="18" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="102" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE 2</text><text x="102" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">the recipient</text><rect x="318" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="402" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="402" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">the first hop</text><rect x="618" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="702" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="702" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="618" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="702" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="702" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">evaluates the iFCs</text><rect x="918" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="1002" y="47.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">HSS</text><text x="1002" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">subscriber data</text><rect x="918" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-widt