P-SM-GW</text><rect x="0" y="345" width="600.23" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="363.75" font-size="16" fill="#57606A" text-anchor="start">Destination-Host</text><rect x="600.23" y="345" width="828.88" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="604.23" y="363.75" font-size="16" fill="#1F2328" text-anchor="start">The IP-SM-GW of the SRA. A TFR always names its node</text><rect x="0" y="372" width="600.23" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="390.75" font-size="16" fill="#57606A" text-anchor="start">User-Name</text><rect x="600.23" y="372" width="828.88" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="604.23" y="390.75" font-size="16" fill="#1F2328" text-anchor="start">UE 2&#39;s IMSI, 001010000000002</text><rect x="0" y="399" width="600.23" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="417.75" font-size="16" fill="#57606A" text-anchor="start">SC-Address</text><rect x="600.23" y="399" width="828.88" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="604.23" y="417.75" font-size="16" fill="#1F2328" text-anchor="start">12025550100, which becomes the RP-OA</text><rect x="0" y="426" width="600.23" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="444.75" font-size="16" fill="#57606A" text-anchor="start">SM-RP-UI</text><rect x="600.23" y="426" width="828.88" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="604.23" y="444.75" font-size="16" fill="#1F2328" text-anchor="start">SMS-DELIVER</text></g>
