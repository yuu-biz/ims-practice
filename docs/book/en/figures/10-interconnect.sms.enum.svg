3" y1="267" x2="204.13" y2="355" stroke="#84A7BF" stroke-width="1.25"/><polygon points="204.13,355 207.16,350.3 209.71,354.6" fill="#84A7BF"/><text x="308.2" y="358.82" font-size="15" fill="#57606A" text-anchor="middle">MESSAGE</text><text x="308.2" y="373.82" font-size="11.5" fill="#57606A" text-anchor="middle">(originating iFC) SIP</text><line x1="145.06" y1="357" x2="354.31" y2="109" stroke="#A5ABB0" stroke-width="1.25" stroke-dasharray="0.1 3.12" stroke-linecap="round"/><polygon points="354.31,109 353,114.43 349.18,111.21" fill="#A5ABB0"/><text x="256.18" y="117.1" font-size="15" fill="#57606A" text-anchor="middle">NAPTR</text><text x="256.18" y="132.1" font-size="11.5" fill="#57606A" text-anchor="middle">(query) DNS</text><line x1="376.94" y1="107" x2="167.69" y2="355" stroke="#5C6670" stroke-width="2.25" stroke-dasharray="0.1 5.62" stroke-linecap="round"/><polygon points="167.69,355 169.46,347.66 174.62,352.02" fill="#5C6670"/><text x="300.04" y="285.86" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">NAPTR</text><text x="300.04" y="300.86" font-size="11.5" fill="#57606A" text-anchor="middle">(answer) DNS</text><text x="0" y="511.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">NAPTR (DNS)  DNS-A → IP-SM-GW-A</text><rect x="0" y="519" width="672.84" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="537.75" font-size="16" fill="#57606A" text-anchor="start">what the rewrite gives</text><rect x="672.84" y="519" width="929.16" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="676.84" y="537.75" font-size="16" fill="#1F2328" text-anchor="start">a SIP URI of network B&#39;s domain with user=phone</text></g>
