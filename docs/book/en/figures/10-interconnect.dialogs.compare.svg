st</text><line x1="288" y1="205.8" x2="456" y2="205.8" stroke="#84A7BF" stroke-width="1.25"/><polygon points="456,205.8 451,208.3 451,203.3" fill="#84A7BF"/><text x="372" y="198.8" font-size="15" fill="#57606A" text-anchor="middle">INVITE (on the link) SIP</text><rect x="346" y="232.8" width="220" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="456" y="252.3" font-size="13.5" fill="#57606A" text-anchor="middle">end it, and send a new request</text><line x1="456" y1="289.8" x2="624" y2="289.8" stroke="#84A7BF" stroke-width="1.25"/><polygon points="624,289.8 619,292.3 619,287.3" fill="#84A7BF"/><text x="540" y="282.8" font-size="15" fill="#57606A" text-anchor="middle">INVITE SIP</text><text x="0" y="369.05" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">INVITE (SIP)  S-CSCF-A → IBCF-A</text><rect x="0" y="376.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="395.55" font-size="16" fill="#57606A" text-anchor="start">Request-URI</text><rect x="312.48" y="376.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="395.55" font-size="16" fill="#1F2328" text-anchor="start">the number in a SIP URI with user=phone</text><rect x="0" y="403.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="422.55" font-size="16" fill="#57606A" text-anchor="start">Call-ID</text><rect x="312.48" y="403.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="422.55" font-size="16" fill="#1F2328" text-anchor="start">the one of the dialog in network A</text><rect x="0" y="430.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="449.55" font-size="16" fill="#57606A" text-anchor="start">Via</text><rect x="312.48" y="430.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="449.55" font-size="16" fill="#1F2328" text-anchor="start">one entry for each node of network A</text><text x="0" y="483.05" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">INVITE (SIP)  IBCF-A → IBCF-B</text><rect x="0" y="490.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="509.55" font-size="16" fill="#57606A" text-anchor="start">Via</text><rect x="312.48" y="490.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="509.55" font-size="16" fill="#1F2328" text-anchor="start">the external name of IBCF-A alone</text><rect x="0" y="517.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="536.55" font-size="16" fill="#57606A" text-anchor="start">Call-ID</text><rect x="312.48" y="517.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="536.55" font-size="16" fill="#1F2328" text-anchor="start">made by IBCF-A, and CSeq is 1</text><rect x="0" y="544.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="563.55" font-size="16" fill="#57606A" text-anchor="start">Contact</text><rect x="312.48" y="544.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="563.55" font-size="16" fill="#1F2328" text-anchor="start">its own external name ibcf.nni.mnc001.example.net</text><text x="0" y="597.05" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">INVITE (SIP)  IBCF-B → I-CSCF-B</text><rect x="0" y="604.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="623.55" font-size="16" fill="#57606A" text-anchor="start">Via</text><rect x="312.48" y="604.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="623.55" font-size="16" fill="#1F2328" text-anchor="start">the internal name of IBCF-B alone</text><rect x="0" y="631.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="650.55" font-size="16" fill="#57606A" text-anchor="start">Call-ID</text><rect x="312.48" y="631.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="650.55" font-size="16" fill="#1F2328" text-anchor="start">made by IBCF-B</text></g>
