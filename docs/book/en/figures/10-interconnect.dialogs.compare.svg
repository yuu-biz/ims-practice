<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 746.8" width="776" height="746.8" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>Three dialogs around the border, three Call-IDs: The three Call-IDs side by side</title>
