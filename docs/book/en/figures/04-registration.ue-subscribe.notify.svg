<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 506.45" width="1136" height="506.45" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>The UE subscribes to the registration state too (13, 14): The NOTIFY reaches the UE through the P-CSCF</title>
<rect width="1136" height="506.45" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="102" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">UE</text><text x="102" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">the phone that registers</text><rect x="318" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="402" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="402" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">its first hop</text><rect x="318" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="402" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">DNS</text><text x="402" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">resolves names</text><rect x="618" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="702" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="702" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="918" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1002" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">HSS</text><text x="1002" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">subscriber data</text><rect x="918" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="1002" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="1002" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">authenticates and registers</text><line x1="189" y1="202" x2="313" y2="202" stroke="#84A7BF" stroke-width="1.25"/><polygon points="313,202 308,204.5 308,199.5" fill="#84A7BF"/><text x="251" y="140.28" font-size="15" fill="#57606A" text-anchor="middle">SUBSCRIBE</text><text x="251" y="155.28" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><line x1="489" y1="202" x2="913" y2="202" stroke="#84A7BF" stroke-width="1.25"/><polygon points="913,202 908,204.5 908,199.5" fill="#84A7BF"/><text x="701" y="168.28" font-size="15" fill="#57606A" text-anchor="middle">SUBSCRIBE</text><text x="701" y="183.28" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><line x1="915" y1="218" x2="491" y2="218" stroke="#84A7BF" stroke-width="1.25"/><polygon points="491,218 496,215.5 496,220.5" fill="#84A7BF"/><text x="703" y="246.72" font-size="15" fill="#57606A" text-anchor="middle">NOTIFY</text><text x="703" y="261.73" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><line x1="315" y1="218" x2="191" y2="218" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="191,218 197.75,214.62 197.75,221.38" fill="#1F5F8B"/><text x="253" y="246.72" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">NOTIFY</text><text x="253" y="261.73" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><text x="0" y="323.7" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">NOTIFY (SIP)  S-CSCF → P-CSCF</text><rect x="0" y="331.45" width="463.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="350.2" font-size="16" fill="#57606A" text-anchor="start">Route</text><rect x="463.68" y="331.45" width="640.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="467.68" y="350.2" font-size="16" fill="#1F2328" text-anchor="start">the P-CSCF, from the Record-Route of the SUBSCRIBE</text><text x="0" y="383.7" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">NOTIFY (SIP)  P-CSCF → UE</text><rect x="0" y="391.45" width="463.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="410.2" font-size="16" fill="#57606A" text-anchor="start">Record-Route</text><rect x="463.68" y="391.45" width="640.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="467.68" y="410.2" font-size="16" fill="#1F2328" text-anchor="start">added by the P-CSCF; the UE builds the route of the subscription from it</text></g>
<line x1="16" y1="465.45" x2="46" y2="465.45" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="469.95" font-size="13" fill="#1D2B36">SIP</text>
<text x="16" y="493.45" font-size="13" fill="#57606A">A schematic of what this implementation does, drawn from the guide. It is not a capture.</text>
</svg>
