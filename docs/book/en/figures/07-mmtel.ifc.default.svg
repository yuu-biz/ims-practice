<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1436 634" width="1436" height="634" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>How a request reaches the AS: four filter criteria: When the AS does not answer</title>
<rect width="1436" height="634" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="102" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">UE 1</text><text x="102" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">the caller</text><rect x="318" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="402" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="402" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">asserts and withholds</text><rect x="618" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="702" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="702" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="918" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="1002" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="1002" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">sends to the AS by iFC</text><rect x="1218" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1302" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">HSS</text><text x="1302" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">iFCs and user settings</text><rect x="1218" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="1302" y="47.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">MMTel AS</text><text x="1302" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">UE 1&#39;s services</text><rect x="1218" y="338" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1302" y="367.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">MMTel AS</text><text x="1302" y="385.75" font-size="12.5" fill="#57606A" text-anchor="middle">UE 2&#39;s services</text><line x1="189" y1="202" x2="313" y2="202" stroke="#84A7BF" stroke-width="1.25"/><polygon points="313,202 308,204.5 308,199.5" fill="#84A7BF"/><text x="251" y="168.28" font-size="15" fill="#57606A" text-anchor="middle">INVITE</text><text x="251" y="183.28" font-size="11.5" fill="#57606A" text-anchor="middle">(C1) SIP</text><line x1="489" y1="202" x2="913" y2="202" stroke="#84A7BF" stroke-width="1.25"/><polygon points="913,202 908,204.5 908,199.5" fill="#84A7BF"/><text x="701" y="168.28" font-size="15" fill="#57606A" text-anchor="middle">INVITE</text><text x="701" y="183.28" font-size="11.5" fill="#57606A" text-anchor="middle">(C1) SIP</text><rect x="922.07" y="252" width="159.87" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="1002" y="271.5" font-size="13.5" fill="#57606A" text-anchor="middle">matches the iFCs</text><line x1="1050.62" y1="175" x2="1215.62" y2="87" stroke="#84A7BF" stroke-width="1.25"/><polygon points="1215.62,87 1212.39,91.56 1210.04,87.15" fill="#84A7BF"/><text x="1110" y="85.15" font-size="15" fill="#57606A" text-anchor="middle">INVITE</text><text x="1110" y="100.15" font-size="11.5" fill="#57606A" text-anchor="middle">(C1) SIP</text><rect x="892" y="138" width="220" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="1.75"/><text x="1002" y="157.5" font-size="13.5" fill="#1D2B36" text-anchor="middle" font-weight="bold">when the AS does not answer</text><text x="0" y="457.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">S-CSCF: when the AS does not answer</text><rect x="0" y="465" width="589.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="483.75" font-size="16" fill="#57606A" text-anchor="start">Originating (priorities 10 and 13)</text><rect x="589.68" y="465" width="814.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="593.68" y="483.75" font-size="16" fill="#1F2328" text-anchor="start">SESSION_TERMINATED. The call ends</text><rect x="0" y="492" width="589.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="510.75" font-size="16" fill="#57606A" text-anchor="start">Terminating (priorities 11 and 12)</text><rect x="589.68" y="492" width="814.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="593.68" y="510.75" font-size="16" fill="#1F2328" text-anchor="start">SESSION_CONTINUED. It goes on without the AS</text><rect x="0" y="519" width="589.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="537.75" font-size="16" fill="#57606A" text-anchor="start">In exchange</text><rect x="589.68" y="519" width="814.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="593.68" y="537.75" font-size="16" fill="#1F2328" text-anchor="start">Outgoing barring always holds. Incoming calls arrive without the barring of the AS</text></g>
<line x1="16" y1="593" x2="46" y2="593" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="597.5" font-size="13" fill="#1D2B36">SIP</text>
<text x="16" y="621" font-size="13" fill="#57606A">A schematic of what this implementation does, drawn from the guide. It is not a capture.</text>
