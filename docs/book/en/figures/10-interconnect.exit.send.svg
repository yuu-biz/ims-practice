<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1094 688" width="1094" height="688" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>Network A finds the peer and sends the request out (1 to 4): IBCF-A sends an INVITE of its own onto the link</title>
<rect width="1094" height="688" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="18" width="756" height="438" fill="#F6F5F1" rx="8" stroke="#BAC3CA" stroke-dasharray="6 4"/><text x="30" y="444.5" font-size="12.5" fill="#57606A" text-anchor="start">network A (ims0)</text><rect x="828" y="178" width="216" height="118" fill="#F6F5F1" rx="8" stroke="#BAC3CA" stroke-dasharray="6 4"/><text x="840" y="284.5" font-size="12.5" fill="#57606A" text-anchor="start">network B (ims1)</text><rect x="312" y="40" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="396" y="69.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">DNS-A</text><text x="396" y="87.75" font-size="12.5" fill="#57606A" text-anchor="middle">answers the ENUM</text><rect x="42" y="200" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="126" y="229.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE A1</text><text x="126" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the UE that calls</text><rect x="312" y="200" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="396" y="229.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF-A</text><text x="396" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the originating side</text><rect x="582" y="200" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="666" y="229.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">IBCF-A</text><text x="666" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the border of network A</text><rect x="582" y="360" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="666" y="389.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">TrGW-A</text><text x="666" y="407.75" font-size="12.5" fill="#57606A" text-anchor="middle">the media of network A</text><rect x="852" y="200" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="936" y="229.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">IBCF-B</text><text x="936" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the border of network B</text><line x1="483" y1="224" x2="577" y2="224" stroke="#84A7BF" stroke-width="1.25"/><polygon points="577,224 572,226.5 572,221.5" fill="#84A7BF"/><text x="530" y="190.28" font-size="15" fill="#57606A" text-anchor="middle">INVITE</text><text x="530" y="205.28" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><line x1="753" y1="224" x2="847" y2="224" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="847,224 840.25,227.38 840.25,220.62" fill="#1F5F8B"/><text x="800" y="162.28" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">INVITE</text><text x="800" y="177.28" font-size="11.5" fill="#57606A" text-anchor="middle">(on the link) SIP</text><text x="0" y="511.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">INVITE (SIP)  IBCF-A → IBCF-B</text><rect x="0" y="519" width="446.04" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="537.75" font-size="16" fill="#57606A" text-anchor="start">Via</text><rect x="446.04" y="519" width="615.96" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="450.04" y="537.75" font-size="16" fill="#1F2328" text-anchor="start">the external name of IBCF-A alone</text><rect x="0" y="546" width="446.04" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="564.75" font-size="16" fill="#57606A" text-anchor="start">Call-ID</text><rect x="446.04" y="546" width="615.96" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="450.04" y="564.75" font-size="16" fill="#1F2328" text-anchor="start">made by IBCF-A, and CSeq is 1</text><rect x="0" y="573" width="446.04" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="591.75" font-size="16" fill="#57606A" text-anchor="start">Contact</text><rect x="446.04" y="573" width="615.96" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="450.04" y="591.75" font-size="16" fill="#1F2328" text-anchor="start">its own external name ibcf.nni.mnc001.example.net</text></g>
<line x1="16" y1="647" x2="46" y2="647" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="651.5" font-size="13" fill="#1D2B36">SIP</text>
<text x="16" y="675" font-size="13" fill="#57606A">A schematic of what this implementation does, drawn from the guide. It is not a capture.</text>
