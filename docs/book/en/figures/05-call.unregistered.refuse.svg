 has no registration to route to</text><rect x="0" y="544.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="563.55" font-size="16" fill="#57606A" text-anchor="start">Result</text><rect x="312.48" y="544.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="563.55" font-size="16" fill="#1F2328" text-anchor="start">No service took the call, so 480</text><text x="0" y="597.05" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">480 (SIP)  S-CSCF → MMTel AS</text><rect x="0" y="604.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="623.55" font-size="16" fill="#57606A" text-anchor="start">Source</text><rect x="312.48" y="604.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="623.55" font-size="16" fill="#1F2328" text-anchor="start">The S-CSCF. The AS copies it onto its own dialog</text></g>
