d by the AS</text><rect x="0" y="472.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="491.55" font-size="16" fill="#57606A" text-anchor="start">The transaction it matches</text><rect x="312.48" y="472.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="491.55" font-size="16" fill="#1F2328" text-anchor="start">the top branch -c, and INVITE as the method of CSeq</text><text x="0" y="525.05" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">200 OK (SIP)  P-CSCF → UE 1</text><rect x="0" y="532.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="551.55" font-size="16" fill="#57606A" text-anchor="start">Via</text><rect x="312.48" y="532.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="551.55" font-size="16" fill="#1F2328" text-anchor="start">-a alone</text><rect x="0" y="559.8" width="312.48" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="578.55" font-size="16" fill="#57606A" text-anchor="start">Dialog</text><rect x="312.48" y="559.8" width="431.52" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="316.48" y="578.55" font-size="16" fill="#1F2328" text-anchor="start">Call-ID c1, with the tags f1 and t1</text></g>
