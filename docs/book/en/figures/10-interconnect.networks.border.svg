ll="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1206" y="229.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">S-CSCF-B</text><text x="1206" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the terminating side</text><rect x="1392" y="200" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1476" y="229.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE B1</text><text x="1476" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the UE that is called</text><rect x="852" y="360" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="936" y="389.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">TrGW-B</text><text x="936" y="407.75" font-size="12.5" fill="#57606A" text-anchor="middle">the media of network B</text><rect x="1392" y="360" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1476" y="389.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">IP-SM-GW-B</text><text x="1476" y="407.75" font-size="12.5" fill="#57606A" text-anchor="middle">the SMS AS of network B</text></g>

