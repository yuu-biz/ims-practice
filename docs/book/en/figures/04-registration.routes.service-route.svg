<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1157.37 460" width="1157.37" height="460" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>The directions of Path and Service-Route: Service-Route is the route of requests from the UE</title>
<rect width="1157.37" height="460" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="39.37" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="123.37" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">UE</text><text x="123.37" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">the phone that registers</text><rect x="339.37" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="423.37" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="423.37" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">its first hop</text><rect x="639.37" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="723.37" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="723.37" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="939.37" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="1023.37" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="1023.37" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">authenticates and registers</text><line x1="210.37" y1="202" x2="334.37" y2="202" stroke="#84A7BF" stroke-width="1.25"/><polygon points="334.37,202 329.37,204.5 329.37,199.5" fill="#84A7BF"/><text x="272.37" y="168.28" font-size="15" fill="#57606A" text-anchor="middle">INVITE</text><text x="272.37" y="183.28" font-size="11.5" fill="#57606A" text-anchor="middle">(outgoing) SIP</text><line x1="510.37" y1="202" x2="934.37" y2="202" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="934.37,202 927.62,205.38 927.62,198.62" fill="#1F5F8B"/><text x="722.37" y="168.28" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">INVITE</text><text x="722.37" y="183.28" font-size="11.5" fill="#57606A" text-anchor="middle">(outgoing) SIP</text><text x="0" y="337.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">INVITE (SIP)  P-CSCF → S-CSCF</text><rect x="0" y="345" width="472.65" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="363.75" font-size="16" fill="#57606A" text-anchor="start">Route</text><rect x="472.65" y="345" width="652.71" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="476.65" y="363.75" font-size="16" fill="#1F2328" text-anchor="start">The P-CSCF removes its own value and checks that the rest is the Service-Route</text></g>
<line x1="16" y1="419" x2="46" y2="419" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="423.5" font-size="13" fill="#1D2B36">SIP</text>
<text x="16" y="447" font-size="13" fill="#57606A">A schematic of what this implementation does, drawn from the guide. It is not a capture.</text>
</svg>
