<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1157.37 574" width="1157.37" height="574" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>The directions of Path and Service-Route: Registration sets up two routes</title>
<rect width="1157.37" height="574" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="39.37" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="123.37" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">UE</text><text x="123.37" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">the phone that registers</text><rect x="339.37" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="423.37" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="423.37" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">its first hop</text><rect x="639.37" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="723.37" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="723.37" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="939.37" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="1023.37" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="1023.37" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">authenticates and registers</text><rect x="959.67" y="252" width="127.39" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="1023.37" y="271.5" font-size="13.5" fill="#57606A" text-anchor="middle">Stores the Path</text><rect x="18" y="252" width="210.74" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="1.75"/><text x="123.37" y="271.5" font-size="13.5" fill="#1D2B36" text-anchor="middle" font-weight="bold">Stores the Service-Route</text><text x="0" y="337.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">S-CSCF: Stores the Path</text><rect x="0" y="345" width="472.65" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="363.75" font-size="16" fill="#57606A" text-anchor="start">What it stores</text><rect x="472.65" y="345" width="652.71" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="476.65" y="363.75" font-size="16" fill="#1F2328" text-anchor="start">The Contact and the Path, sip:term@pcscf...</text><rect x="0" y="372" width="472.65" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="390.75" font-size="16" fill="#57606A" text-anchor="start">When it is used</text><rect x="472.65" y="372" width="652.71" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="476.65" y="390.75" font-size="16" fill="#1F2328" text-anchor="start">When a request for this UE goes out</text><text x="0" y="424.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">UE: Stores the Service-Route</text><rect x="0" y="432" width="472.65" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="450.75" font-size="16" fill="#57606A" text-anchor="start">What it stores</text><rect x="472.65" y="432" width="652.71" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="476.65" y="450.75" font-size="16" fill="#1F2328" text-anchor="start">The Service-Route of the 200 OK, sip:orig@scscf...</text><rect x="0" y="459" width="472.65" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="477.75" font-size="16" fill="#57606A" text-anchor="start">When it is used</text><rect x="472.65" y="459" width="652.71" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="476.65" y="477.75" font-size="16" fill="#1F2328" text-anchor="start">When the UE sends a new request</text></g>

<text x="16" y="561" font-size="13" fill="#57606A">A schematic of what this implementation does, drawn from the guide. It is not a capture.</text>
