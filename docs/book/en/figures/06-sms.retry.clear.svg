<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1462 594.55" width="1462" height="594.55" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>The retry, and the report of a delivery (D1 to D3): The HSS clears MCEF</title>
<rect width="1462" height="594.55" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="28.99" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="102" y="58.24" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE 1</text><text x="102" y="76.74" font-size="12.5" fill="#57606A" text-anchor="middle">the sender</text><rect x="18" y="188.99" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="102" y="218.24" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE 2</text><text x="102" y="236.74" font-size="12.5" fill="#57606A" text-anchor="middle">the recipient</text><rect x="318" y="188.99" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="402" y="218.24" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="402" y="236.74" font-size="12.5" fill="#57606A" text-anchor="middle">the first hop</text><rect x="618" y="28.99" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="702" y="58.24" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="702" y="76.74" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="618" y="188.99" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="702" y="218.24" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="702" y="236.74" font-size="12.5" fill="#57606A" text-anchor="middle">evaluates the iFCs</text><rect x="918" y="28.99" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="1002" y="58.24" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">HSS</text><text x="1002" y="76.74" font-size="12.5" fill="#57606A" text-anchor="middle">subscriber data</text><rect x="918" y="188.99" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="1002" y="218.24" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">IP-SM-GW</text><text x="1002" y="236.74" font-size="12.5" fill="#57606A" text-anchor="middle">the AS for SMS</text><rect x="1218" y="188.99" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="1302" y="218.24" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">SC</text><text x="1302" y="236.74" font-size="12.5" fill="#57606A" text-anchor="middle">holds and delivers</text><line x1="1219.38" y1="185.99" x2="1054.38" y2="97.99" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="1054.38,97.99 1059.96,98.14 1057.61,102.55" fill="#C7A573"/><text x="1128.95" y="186.14" font-size="15" fill="#57606A" text-anchor="middle">SRR</text><text x="1128.95" y="201.14" font-size="11.5" fill="#57606A" text-anchor="middle">(retry) S6c</text><line x1="1084.62" y1="95.99" x2="1249.62" y2="183.99" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="1249.62,183.99 1244.04,183.84 1246.39,179.43" fill="#C7A573"/><text x="1188.25" y="97.88" font-size="15" fill="#57606A" text-anchor="middle">SRA</text><text x="1188.25" y="112.88" font-size="11.5" fill="#57606A" text-anchor="middle">(retry) S6c</text><line x1="1215" y1="228.99" x2="1091" y2="228.99" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="1091,228.99 1096,226.49 1096,231.49" fill="#C7A573"/><text x="1153" y="257.71" font-size="15" fill="#57606A" text-anchor="middle">TFR</text><text x="1153" y="272.71" font-size="11.5" fill="#57606A" text-anchor="middle">(D2) SGd</text><line x1="1089" y1="212.99" x2="1213" y2="212.99" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="1213,212.99 1208,215.49 1208,210.49" fill="#C7A573"/><text x="1116.28" y="137.26" font-size="15" fill="#57606A" text-anchor="middle">TFA</text><text x="1116.28" y="152.26" font-size="11.5" fill="#57606A" text-anchor="middle">(D2) SGd</text><rect x="1192" y="262.99" width="220" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="1302" y="282.49" font-size="13.5" fill="#57606A" text-anchor="middle">reports the delivery to the HSS</text><line x1="1215" y1="199.52" x2="1024.62" y2="97.99" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="1024.62,97.99 1030.21,98.14 1027.86,102.55" fill="#C7A573"/><text x="1067.6" y="280.83" font-size="15" fill="#57606A" text-anchor="middle">RDR</text><text x="1067.6" y="295.83" font-size="11.5" fill="#57606A" text-anchor="middle">(D3) S6c</text><rect x="937.08" y="102.99" width="129.84" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="1.75"/><text x="1002" y="122.49" font-size="13.5" fill="#1D2B36" text-anchor="middle" font-weight="bold">clears MCEF</text><line x1="1089" y1="82.45" x2="1279.38" y2="183.99" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="1279.38,183.99 1273.79,183.84 1276.14,179.43" fill="#C7A573"/><text x="1235.39" y="34.73" font-size="15" fill="#57606A" text-anchor="middle">RDA</text><text x="1235.39" y="49.73" font-size="11.5" fill="#57606A" text-anchor="middle">(D3) S6c</text><text x="0" y="357.8" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">SRA (S6c)  HSS → SC</text><rect x="0" y="365.55" width="600.6" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="384.3" font-size="16" fill="#57606A" text-anchor="start">IP-SM-GW-Name</text><rect x="600.6" y="365.55" width="829.4" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="604.6" y="384.3" font-size="16" fill="#1F2328" text-anchor="start">There: a full memory sets no UNRI</text><rect x="0" y="392.55" width="600.6" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="411.3" font-size="16" fill="#57606A" text-anchor="start">MWD-Status</text><rect x="600.6" y="392.55" width="829.4" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="604.6" y="411.3" font-size="16" fill="#1F2328" text-anchor="start">Bit 2, MCEF-Set, is set. Bit 0 is clear</text><text x="0" y="444.8" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">HSS: clears MCEF</text><rect x="0" y="452.55" width="600.6" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="471.3" font-size="16" fill="#57606A" text-anchor="start">MCEF</text><rect x="600.6" y="452.55" width="829.4" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="604.6" y="471.3" font-size="16" fill="#1F2328" text-anchor="start">Cleared</text><rect x="0" y="479.55" width="600.6" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="498.3" font-size="16" fill="#57606A" text-anchor="start">MWD</text><rect x="600.6" y="479.55" width="829.4" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="604.6" y="498.3" font-size="16" fill="#1F2328" text-anchor="start">The SC&#39;s address goes; the other SCs left are alerted</text></g>
<line x1="16" y1="553.55" x2="46" y2="553.55" stroke="#9A5B00" stroke-width="2" stroke-dasharray="8 6"/><text x="52" y="558.05" font-size="13" fill="#1D2B36">Diameter</text>
<text x="16" y="581.55" font-size="13" fill="#57606A">A schematic of what this implementation does, drawn from the guide. It is not a capture.</text>
</svg>
