ll="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="1002" y="111.5" font-size="13.5" fill="#57606A" text-anchor="middle">forgets the stored S-CSCF</text><text x="0" y="337.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">SAR (Cx)  S-CSCF → HSS</text><rect x="0" y="345" width="474.6" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="363.75" font-size="16" fill="#57606A" text-anchor="start">Server-Assignment-Type</text><rect x="474.6" y="345" width="655.4" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="478.6" y="363.75" font-size="16" fill="#1F2328" text-anchor="start">AUTHENTICATION_FAILURE (9)</text><text x="0" y="397.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">HSS: forgets the stored S-CSCF</text><rect x="0" y="405" width="474.6" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="423.75" font-size="16" fill="#57606A" text-anchor="start">next attempt</text><rect x="474.6" y="405" width="655.4" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="478.6" y="423.75" font-size="16" fill="#1F2328" text-anchor="start">starts again from DIAMETER_FIRST_REGISTRATION</text></g>
