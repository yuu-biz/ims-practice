<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762.59 526.25" width="762.59" height="526.25" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>A deregistration that comes late: An SAR, and the values of B are stored</title>
<rect width="762.59" height="526.25" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="63.25" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="102" y="92.5" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="102" y="111" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="318" y="223.25" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="402" y="252.5" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="402" y="271" font-size="12.5" fill="#57606A" text-anchor="middle">authenticates and registers</text><rect x="318" y="63.25" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="402" y="92.5" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">HSS</text><text x="402" y="111" font-size="12.5" fill="#57606A" text-anchor="middle">subscriber data</text><rect x="309.55" y="297.25" width="184.89" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="402" y="316.75" font-size="13.5" fill="#57606A" text-anchor="middle">Holds the registration</text><line x1="184.62" y1="130.25" x2="349.62" y2="218.25" stroke="#84A7BF" stroke-width="1.25"/><polygon points="349.62,218.25 344.04,218.1 346.39,213.69" fill="#84A7BF"/><text x="280.86" y="34.73" font-size="15" fill="#57606A" text-anchor="middle">REGISTER</text><text x="280.86" y="49.73" font-size="11.5" fill="#57606A" text-anchor="middle">(another Call-ID) SIP</text><rect x="292" y="183.25" width="220" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="402" y="202.75" font-size="13.5" fill="#57606A" text-anchor="middle">Does not compare the CSeq</text><line x1="394" y1="220.25" x2="394" y2="132.25" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="394,132.25 396.5,137.25 391.5,137.25" fill="#C7A573"/><text x="358.35" y="154.39" font-size="15" fill="#57606A" text-anchor="middle">SAR</text><text x="358.35" y="169.39" font-size="11.5" fill="#57606A" text-anchor="middle">Cx</text><line x1="410" y1="130.25" x2="410" y2="218.25" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="410,218.25 407.5,213.25 412.5,213.25" fill="#C7A573"/><text x="445.21" y="152.39" font-size="15" fill="#57606A" text-anchor="middle">SAA</text><text x="445.21" y="167.39" font-size="11.5" fill="#57606A" text-anchor="middle">Cx</text><line x1="319.38" y1="220.25" x2="154.38" y2="132.25" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="154.38,132.25 161.92,132.45 158.74,138.4" fill="#1F5F8B"/><text x="213.45" y="217.67" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">200 OK</text><text x="213.45" y="232.67" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><text x="0" y="382.5" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">200 OK (SIP)  S-CSCF → I-CSCF</text><rect x="0" y="390.25" width="306.85" height="48" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="409" font-size="16" fill="#57606A" text-anchor="start">Values stored</text><rect x="306.85" y="390.25" width="423.74" height="48" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="310.85" y="409" font-size="16" fill="#1F2328" text-anchor="start">Call-ID B and CSeq 2. The next request is compared</text><text x="310.85" y="430" font-size="16" fill="#1F2328" text-anchor="start">with them</text></g>
<line x1="16" y1="485.25" x2="46" y2="485.25" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="489.75" font-size="13" fill="#1D2B36">SIP</text><line x1="100.18" y1="485.25" x2="130.18" y2="485.25" stroke="#9A5B00" stroke-width="2" stroke-dasharray="8 6"/><text x="136.18" y="489.75" font-size="13" fill="#1D2B36">Diameter</text>
