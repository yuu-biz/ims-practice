2"/><text x="1002" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">IP-SM-GW</text><text x="1002" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">the AS for SMS</text><rect x="1218" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1302" y="207.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">SC</text><text x="1302" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">holds and delivers</text><line x1="1010" y1="85" x2="1010" y2="173" stroke="#C7A573" stroke-width="1.25" stroke-dasharray="5 3.75"/><polygon points="1010,173 1007.5,168 1012.5,168" fill="#C7A573"/><text x="1082.1" y="126.5" font-size="15" fill="#57606A" text-anchor="middle">Ready-For-SM</text><text x="1082.1" y="141.5" font-size="11.5" fill="#57606A" text-anchor="middle">(answer) S6c</text><line x1="919.38" y1="175" x2="754.38" y2="87" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="754.38,87 761.92,87.2 758.74,93.15" fill="#1F5F8B"/><text x="846.96" y="197.01" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">MESSAGE</text><text x="846.96" y="212.01" font-size="11.5" fill="#57606A" text-anchor="middle">(B8) SIP</text><line x1="710" y1="85" x2="710" y2="173" stroke="#84A7BF" stroke-width="1.25"/><polygon points="710,173 707.5,168 712.5,168" fill="#84A7BF"/><text x="769.06" y="126.5" font-size="15" fill="#57606A" text-anchor="middle">MESSAGE</text><text x="769.06" y="141.5" font-size="11.5" fill="#57606A" text-anchor="middle">(B8) SIP</text><line x1="615" y1="218" x2="491" y2="218" stroke="#84A7BF" stroke-width="1.25"/><polygon points="491,218 496,215.5 496,220.5" fill="#84A7BF"/><text x="553" y="246.72" font-size="15" fill="#57606A" text-anchor="middle">MESSAGE</text><text x="553" y="261.73" font-size="11.5" fill="#57606A" text-anchor="middle">(B8) SIP</text><line x1="315" y1="218" x2="191" y2="218" stroke="#84A7BF" stroke-width="1.25"/><polygon points="191,218 196,215.5 196,220.5" fill="#84A7BF"/><text x="253" y="246.72" font-size="15" fill="#57606A" text-anchor="middle">MESSAGE</text><text x="253" y="261.73" font-size="11.5" fill="#57606A" text-anchor="middle">(B8) SIP</text><text x="0" y="323.7" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">MESSAGE (SIP)  IP-SM-GW → I-CSCF</text><rect x="0" y="331.45" width="589.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="350.2" font-size="16" fill="#57606A" text-anchor="start">Body</text><rect x="589.68" y="331.45" width="814.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="593.68" y="350.2" font-size="16" fill="#1F2328" text-anchor="start">RP-ACK: the answer to the notification of B5</text><rect x="0" y="358.45" width="589.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="377.2" font-size="16" fill="#57606A" text-anchor="start">When</text><rect x="589.68" y="358.45" width="814.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="593.68" y="377.2" font-size="16" fill="#1F2328" text-anchor="start">After the HSS has taken the notification</text><rect x="0" y="385.45" width="589.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="404.2" font-size="16" fill="#57606A" text-anchor="start">If the HSS cannot take it</text><rect x="589.68" y="385.45" width="814.32" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="593.68" y="404.2" font-size="16" fill="#1F2328" text-anchor="start">RP-ERROR instead of RP-ACK</text></g>
