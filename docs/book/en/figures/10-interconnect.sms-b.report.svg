/text><line x1="169.37" y1="357" x2="317.87" y2="269" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="317.87,269 313.78,275.34 310.34,269.54" fill="#1F5F8B"/><text x="172.72" y="285.67" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">MESSAGE</text><text x="172.72" y="300.67" font-size="11.5" fill="#57606A" text-anchor="middle">(status report) SIP</text><line x1="309" y1="240" x2="215" y2="240" stroke="#84A7BF" stroke-width="1.25"/><polygon points="215,240 220,237.5 220,242.5" fill="#84A7BF"/><text x="276.1" y="338.73" font-size="15" fill="#57606A" text-anchor="middle">MESSAGE</text><text x="276.1" y="353.73" font-size="11.5" fill="#57606A" text-anchor="middle">(via the P-CSCF) SIP</text><text x="0" y="511.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">MESSAGE (SIP)  IP-SM-GW-A → S-CSCF-A</text><rect x="0" y="519" width="672.84" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="537.75" font-size="16" fill="#57606A" text-anchor="start">TP-ST</text><rect x="672.84" y="519" width="929.16" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="676.84" y="537.75" font-size="16" fill="#1F2328" text-anchor="start">1, forwarded but the delivery cannot be confirmed</text></g>
