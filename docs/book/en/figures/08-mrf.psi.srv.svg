25"/><polygon points="394,247 396.5,252 391.5,252" fill="#84A7BF"/><text x="459.81" y="288.5" font-size="15" fill="#57606A" text-anchor="middle">SUBSCRIBE</text><text x="459.81" y="303.5" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><line x1="394" y1="175" x2="394" y2="87" stroke="#A5ABB0" stroke-width="1.25" stroke-dasharray="0.1 3.12" stroke-linecap="round"/><polygon points="394,87 396.5,92 391.5,92" fill="#A5ABB0"/><text x="337.8" y="128.5" font-size="15" fill="#57606A" text-anchor="middle">NAPTR</text><text x="337.8" y="143.5" font-size="11.5" fill="#57606A" text-anchor="middle">(query) DNS</text><line x1="410" y1="85" x2="410" y2="173" stroke="#A5ABB0" stroke-width="1.25" stroke-dasharray="0.1 3.12" stroke-linecap="round"/><polygon points="410,173 407.5,168 412.5,168" fill="#A5ABB0"/><text x="465.1" y="126.5" font-size="15" fill="#57606A" text-anchor="middle">NAPTR</text><text x="465.1" y="141.5" font-size="11.5" fill="#57606A" text-anchor="middle">(answer) DNS</text><line x1="380" y1="175" x2="380" y2="87" stroke="#A5ABB0" stroke-width="1.25" stroke-dasharray="0.1 3.12" stroke-linecap="round"/><polygon points="380,87 382.5,92 377.5,92" fill="#A5ABB0"/><text x="247.16" y="128.5" font-size="15" fill="#57606A" text-anchor="middle">SRV</text><text x="247.16" y="143.5" font-size="11.5" fill="#57606A" text-anchor="middle">(query) DNS</text><line x1="424" y1="85" x2="424" y2="173" stroke="#5C6670" stroke-width="2.25" stroke-dasharray="0.1 5.62" stroke-linecap="round"/><polygon points="424,173 420.62,166.25 427.38,166.25" fill="#5C6670"/><text x="569.3" y="126.5" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">SRV</text><text x="569.3" y="141.5" font-size="11.5" fill="#57606A" text-anchor="middle">(answer) DNS</text><text x="0" y="457.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">SRV (DNS)  DNS → S-CSCF</text><rect x="0" y="465" width="463.68" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.