<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1137.78 634" width="1137.78" height="634" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>Checking the network and answering with IMS AKA (7 to 12): The 200 OK comes back to the phone</title>
