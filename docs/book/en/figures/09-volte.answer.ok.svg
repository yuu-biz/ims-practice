<g transform="translate(16 16)"><rect x="19.78" y="18" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="103.78" y="47.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">volte10</text><text x="103.78" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">the caller&#39;s phone</text><rect x="319.78" y="338" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="403.78" y="367.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">EPC + PCRF</text><text x="403.78" y="385.75" font-size="12.5" fill="#57606A" text-anchor="middle">the access network stub</text><rect x="319.78" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="403.78" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="403.78" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">its first hop</text><rect x="619.78" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="703.78" y="47.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="703.78" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="919.78" y="178" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#AEB7BF" stroke-width="0.75"/><text x="1003.78" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="1003.78" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">authenticates and registers</text><rect x="919.78" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="1003.78" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">HSS</text><text x="1003.78" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">makes the vectors</text><line x1="921.15" y1="175" x2="756.15" y2="87" stroke="#84A7BF" stroke-width="1.25"/><polygon points="756.15,87 761.74,87.15 759.39,91.56" fill="#84A7BF"/><text x="817.39" y="168.37" font-size="15" fill="#57606A" text-anchor="middle">200 OK</text><text x="817.39" y="183.37" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><line x1="655.15" y1="85" x2="490.15" y2="173" stroke="#84A7BF" stroke-width="1.25"/><polygon points="490.15,173 493.39,168.44 495.74,172.85" fill="#84A7BF"/><text x="593.92" y="166.37" font-size="15" fill="#57606A" text-anchor="middle">200 OK</text><text x="593.92" y="181.37" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><line x1="321.15" y1="175" x2="156.15" y2="87" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="156.15,87 163.7,87.2 160.52,93.15" fill="#1F5F8B"/><text x="215.23" y="172.42" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">200 OK</text><text x="215.23" y="187.42" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><text x="0" y="457.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">200 OK (SIP)  P-CSCF → volte10</text><rect x="0" y="465" width="464.43" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="483.75" font-size="16" fill="#57606A" text-anchor="start">where to</text><rect x="464.43" y="465" width="641.35" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="468.43" y="483.75" font-size="16" fill="#1F2328" text-anchor="start">from the P-CSCF&#39;s 5064 to the UE&#39;s 5062</text><rect x="0" y="492" width="464.43" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="510.75" font-size="16" fill="#57606A" text-anchor="start">from now on</text><rect x="464.43" y="492" width="641.35" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="468.43" y="510.75" font-size="16" fill="#1F2328" text-anchor="start">the UE sends every request to port 5064</text><rect x="0" y="519" width="464.43" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="537.75" font-size="16" fill="#57606A" text-anchor="start">P-Associated-URI</text><rect x="464.43" y="519" width="641.35" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="468.43" y="537.75" font-size="16" fill="#1F2328" text-anchor="start">the identities that are not barred, the default first</text></g>
