<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1157.37 460" width="1157.37" height="460" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>The directions of Path and Service-Route: Path is the route of requests to the UE</title>
<rect width="1157.37" height="460" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="39.37" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="123.37" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">UE</text><text x="123.37" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">the phone that registers</text><rect x="339.37" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="423.37" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">P-CSCF</text><text x="423.37" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">its first hop</text><rect x="639.37" y="18" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="723.37" y="47.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="723.37" y="65.75" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="939.37" y="178" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="1023.37" y="207.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="1023.37" y="225.75" font-size="12.5" fill="#57606A" text-anchor="middle">authenticates and registers</text><line x1="936.37" y1="218" x2="512.37" y2="218" stroke="#84A7BF" stroke-width="1.25"/><polygon points="512.37,218 517.37,215.5 517.37,220.5" fill="#84A7BF"/><text x="724.37" y="246.72" font-size="15" fill="#57606A" text-anchor="middle">INVITE</text><text x="724.37" y="261.73" font-size="11.5" fill="#57606A" text-anchor="middle">(incoming) SIP</text><line x1="336.37" y1="218" x2="212.37" y2="218" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="212.37,218 219.12,214.62 219.12,221.38" fill="#1F5F8B"/><text x="274.37" y="246.72" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">INVITE</text><text x="274.37" y="261.73" font-size="11.5" fill="#57606A" text-anchor="middle">(incoming) SIP</text><text x="0" y="337.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">INVITE (SIP)  P-CSCF → UE</text><rect x="0" y="345" width="472.65" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="363.75" font-size="16" fill="#57606A" text-anchor="start">Route</text><rect x="472.65" y="345" width="652.71" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="476.65" y="363.75" font-size="16" fill="#1F2328" text-anchor="start">The P-CSCF removes its own value, and none is left</text></g>
<line x1="16" y1="419" x2="46" y2="419" stroke="#1F5F8B" stroke-width="2"/><text x="52" y="423.5" font-size="13" fill="#1D2B36">SIP</text>
<text x="16" y="447" font-size="13" fill="#57606A">A schematic of what this implementation does, drawn from the guide. It is not a capture.</text>
</svg>
