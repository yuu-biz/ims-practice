<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 762.59 640.25" width="762.59" height="640.25" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>A deregistration that comes late: A 500, and the registration stays</title>
<rect width="762.59" height="640.25" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="63.25" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="102" y="92.5" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">I-CSCF</text><text x="102" y="111" font-size="12.5" fill="#57606A" text-anchor="middle">entry of the home network</text><rect x="318" y="223.25" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="402" y="252.5" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF</text><text x="402" y="271" font-size="12.5" fill="#57606A" text-anchor="middle">authenticates and registers</text><rect x="318" y="63.25" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="402" y="92.5" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">HSS</text><text x="402" y="111" font-size="12.5" fill="#57606A" text-anchor="middle">subscriber data</text><rect x="309.55" y="297.25" width="184.89" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="402" y="316.75" font-size="13.5" fill="#57606A" text-anchor="middle">Holds the registration</text><line x1="184.62" y1="130.25" x2="349.62" y2="218.25" stroke="#84A7BF" stroke-width="1.25"/><polygon points="349.62,218.25 344.04,218.1 346.39,213.69" fill="#84A7BF"/><text x="292.32" y="37.08" font-size="15" fill="#57606A" text-anchor="middle">REGISTER</text><text x="292.32" y="52.08" font-size="11.5" fill="#57606A" text-anchor="middle">(late deregistration) SIP</text><rect x="313.73" y="183.25" width="176.55" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="402" y="202.75" font-size="13.5" fill="#57606A" text-anchor="middle">Compares the order</text><line x1="319.38" y1="220.25" x2="154.38" y2="132.25" stroke="#1F5F8B" stroke-width="2.25"/><polygon points="154.38,132.25 161.92,132.45 158.74,138.4" fill="#1F5F8B"/><text x="216.54" y="211.87" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">500</text><text x="216.54" y="226.87" font-size="11.5" fill="#57606A" text-anchor="middle">SIP</text><rect x="496" y="240.25" width="216.59" height="30" fill="#FFF4D6" rx="8" stroke="#B08A1E" stroke-width="0.75"/><text x="604.29" y="259.75" font-size="13.5" fill="#57606A" text-anchor="middle">Keeps the registration as it is</text><text x="0" y="382.5" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">500 (SIP)  S-CSCF → I-CSCF</text><rect x="0" y="390.25" width="306.85" height="48" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="409" font-size="16" fill="#57606A" text-anchor="start">Status code</text><rect x="306.85" y="390.25" width="423.74" height="48" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="310.85" y="409" font-size="16" fill="#1F2328" text-anchor="start">RFC 3261 10.3 names none. This implementation</text><text x="310.85" y="430" font-size="16" fill="#1F2328" text-anchor="start">answers 500</text><text x="0" y="463.5" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">S-CSCF: Keeps the registration as it is</text><rect x="0" y="471.25" width="306.85" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="490" font-size="16" fill="#57606A" text-anchor="start">Contact and expiry</text><rect x="306.85" y="471.25" width="423.74" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="310.85" y="490" font-size="16" fill="#1F2328" text-anchor="start">Unchanged</text><rect x="0" y="498.25" width="306.85" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="517" font-size="16" fill="#57606A" text-anchor="start">CSeq</text><rect x="306.85" y="498.25" width="423.74" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="310.85" y="517" font-size="16" fill="#1F2328" text-anchor="start">Still 5</text><rect x="0" y="525.25" width="306.85" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="544" font-size="16" fill="#57606A" text-anchor="start">HSS</text><rect x="306.85" y="525.25" width="423.74" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="310.85" y="544" font-size="16" fill="#1F2328" text-anchor="start">No SAR for a deregistration</text></g>
