<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1094 721" width="1094" height="721" font-family="Calibri, Carlito, &#34;Segoe UI&#34;, Arial, &#34;Noto Sans CJK JP&#34;, &#34;Noto Sans JP&#34;, &#34;Yu Gothic UI&#34;, &#34;Yu Gothic&#34;, YuGothic, &#34;Hiragino Sans&#34;, Meiryo, sans-serif" role="img">
<title>Network A finds the peer and sends the request out (1 to 4): The ENUM gives the domain of network B</title>
<rect width="1094" height="721" fill="#F6F5F1"/>
<g transform="translate(16 16)"><rect x="18" y="18" width="756" height="438" fill="#F6F5F1" rx="8" stroke="#BAC3CA" stroke-dasharray="6 4"/><text x="30" y="444.5" font-size="12.5" fill="#57606A" text-anchor="start">network A (ims0)</text><rect x="828" y="178" width="216" height="118" fill="#F6F5F1" rx="8" stroke="#BAC3CA" stroke-dasharray="6 4"/><text x="840" y="284.5" font-size="12.5" fill="#57606A" text-anchor="start">network B (ims1)</text><rect x="312" y="40" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="396" y="69.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">DNS-A</text><text x="396" y="87.75" font-size="12.5" fill="#57606A" text-anchor="middle">answers the ENUM</text><rect x="42" y="200" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="126" y="229.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">UE A1</text><text x="126" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the UE that calls</text><rect x="312" y="200" width="168" height="64" fill="#F6E7C1" rx="8" stroke="#1D2B36" stroke-width="2"/><text x="396" y="229.25" font-size="19" fill="#1D2B36" text-anchor="middle" font-weight="bold">S-CSCF-A</text><text x="396" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the originating side</text><rect x="582" y="200" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="666" y="229.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">IBCF-A</text><text x="666" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the border of network A</text><rect x="582" y="360" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="666" y="389.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">TrGW-A</text><text x="666" y="407.75" font-size="12.5" fill="#57606A" text-anchor="middle">the media of network A</text><rect x="852" y="200" width="168" height="64" fill="#FFFFFF" rx="8" stroke="#D9DEE2" stroke-width="0.75"/><text x="936" y="229.25" font-size="19" fill="#8A949D" text-anchor="middle" font-weight="bold">IBCF-B</text><text x="936" y="247.75" font-size="12.5" fill="#57606A" text-anchor="middle">the border of network B</text><line x1="388" y1="197" x2="388" y2="109" stroke="#A5ABB0" stroke-width="1.25" stroke-dasharray="0.1 3.12" stroke-linecap="round"/><polygon points="388,109 390.5,114 385.5,114" fill="#A5ABB0"/><text x="337.05" y="150.5" font-size="15" fill="#57606A" text-anchor="middle">NAPTR</text><text x="337.05" y="165.5" font-size="11.5" fill="#57606A" text-anchor="middle">(query) DNS</text><line x1="404" y1="107" x2="404" y2="195" stroke="#5C6670" stroke-width="2.25" stroke-dasharray="0.1 5.62" stroke-linecap="round"/><polygon points="404,195 400.62,188.25 407.38,188.25" fill="#5C6670"/><text x="460.2" y="148.5" font-size="15" fill="#1D2B36" text-anchor="middle" font-weight="bold">NAPTR</text><text x="460.2" y="163.5" font-size="11.5" fill="#57606A" text-anchor="middle">(answer) DNS</text><text x="0" y="511.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">NAPTR (DNS)  S-CSCF-A → DNS-A</text><rect x="0" y="519" width="446.04" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="537.75" font-size="16" fill="#57606A" text-anchor="start">name</text><rect x="446.04" y="519" width="615.96" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="450.04" y="537.75" font-size="16" fill="#1F2328" text-anchor="start">1.5.1.0.5.5.5.2.0.2.1.e164.arpa</text><text x="0" y="571.25" font-size="17.5" fill="#1D2B36" text-anchor="start" font-weight="bold">NAPTR (DNS)  DNS-A → S-CSCF-A</text><rect x="0" y="579" width="446.04" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="597.75" font-size="16" fill="#57606A" text-anchor="start">service</text><rect x="446.04" y="579" width="615.96" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="450.04" y="597.75" font-size="16" fill="#1F2328" text-anchor="start">E2U+sip</text><rect x="0" y="606" width="446.04" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="4" y="624.75" font-size="16" fill="#57606A" text-anchor="start">what the rewrite gives</text><rect x="446.04" y="606" width="615.96" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="450.04" y="624.75" font-size="16" fill="#1F2328" text-anchor="start">a SIP URI of network B&#39;s domain with user=phone</text></g>
<line x1="16" y1="680" x2="46" y2="680" stroke="#5C6670" stroke-width="2" stroke-dasharray="0.1 5" stroke-linecap="round"/><text x="52" y="684.5" font-size="13" fill="#1D2B36">DNS</text>
<text x="16" y="708" font-size="13" fill="#57606A">A schematic of what this implementation does, drawn from the guide. It is not a capture.</text>
