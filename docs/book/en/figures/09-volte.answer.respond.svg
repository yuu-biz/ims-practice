75" font-size="16" fill="#57606A" text-anchor="start">Authorization</text><rect x="464.43" y="519" width="641.35" height="27" fill="none" stroke="#D0D7DE" stroke-width="0.75"/><text x="468.43" y="537.75" font-size="16" fill="#1F2328" text-anchor="start">the response, with RES as the password</text></g>
