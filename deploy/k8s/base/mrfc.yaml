# MRFC, the control side of the MRF. The MMTel AS reaches it by the name
# in config/mmtel.yaml, through DNS. A StatefulSet with a headless
# Service for the same reasons as the I-CSCF (icscf.yaml). One replica:
# the MRFC keeps its conferences in memory.
apiVersion: v1
kind: Service
metadata:
  name: mrfc
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mrfc
  ports:
    - name: sip
      port: 5060
      protocol: UDP
    - name: sip-tcp
      port: 5060
      protocol: TCP
    # Where the MRFPs report the end of an announcement.
    - name: notify
      port: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mrfc
spec:
  serviceName: mrfc
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: mrfc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mrfc
    spec:
      terminationGracePeriodSeconds: 10
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: ims
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: sip
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
            - name: notify
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/ims
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mrfc-config
