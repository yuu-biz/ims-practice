      containers:
        - name: ue
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          command: [ue]
          args:
            - serve
            - -control
            - 0.0.0.0:8090
            - -pcscf
            - pcscf.ims.mnc001.mcc001.3gppnetwork.org:5060
            - -impi
            - 001010000000002@ims.mnc001.mcc001.3gppnetwork.org
            - -impu
            - sip:+12025550102@ims.mnc001.mcc001.3gppnetwork.org
            - -password
            - test-password-2
          env:
            - name: UE_HEP
              value: lab.ims.svc.cluster.local:9060
          ports:
            - name: control
              containerPort: 8090
              protocol: TCP
---
