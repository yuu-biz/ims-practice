# The UE simulators. Docker Compose starts one container per
# command (docker compose run --rm ue register); here a Pod waits, and
# each command runs in it:
#   kubectl -n ims exec deploy/ue -- ue register \
#     -pcscf pcscf.ims.mnc001.mcc001.3gppnetwork.org:5060 -deregister-after 2s
# A Deployment: a UE is not part of the network, and nothing finds it by
# a name of its own. It registers its Pod address in Contact.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ue
    spec:
      terminationGracePeriodSeconds: 2
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: ue
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'trap "exit 0" TERM; while :; do sleep 1; done']
          env:
            - name: UE_HEP
              value: lab.ims.svc.cluster.local:9060
---
# The second subscriber, to call (kubectl -n ims exec deploy/ue2 -- ue
# answer -impi ..., as the end-to-end script of calls does).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ue2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ue2
    spec:
      terminationGracePeriodSeconds: 2
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: ue
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          command: [sh, -c, 'trap "exit 0" TERM; while :; do sleep 1; done']
          env:
            - name: UE_HEP
              value: lab.ims.svc.cluster.local:9060
---
# Two UE simulators that stay up and do what the Lab asks ("ue
# serve"), as ue-a and ue-b of compose.yaml. ue-b is subscriber 2.
apiVersion: v1
kind: Service
metadata:
  name: ue-a
spec:
  selector:
    app.kubernetes.io/name: ue-a
  ports:
    # The control API of "ue serve", reached through the Lab only.
    - name: control
      port: 8090
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue-a
spec:
  # Zero, like the sim profile of compose.yaml: these UEs use the
  # subscribers of ue and ue2. Run one pair at a time, with
  # kubectl -n ims scale deployment ue ue2 --replicas=0 and
  # kubectl -n ims scale deployment ue-a ue-b --replicas=1.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ue-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ue-a
    spec:
      terminationGracePeriodSeconds: 10
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: ue
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          command: [ue]
          args:
            - serve
            - -control
            - 0.0.0.0:8090
            - -pcscf
            - pcscf.ims.mnc001.mcc001.3gppnetwork.org:5060
          env:
            - name: UE_HEP
              value: lab.ims.svc.cluster.local:9060
          ports:
            - name: control
              containerPort: 8090
              protocol: TCP
---
