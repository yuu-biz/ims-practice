# Generated by "go generate ./deploy/k8s/..." from
# deploy/compose/lab.yaml and
# deploy/k8s/changes.go. Change those, not this file.

# The Lab. It builds its view only from the HEP copies the
# nodes send, and serves the web UI on port 8080.
node: lab
roles: [lab]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
lab:
  hep_listen: 0.0.0.0:9060
  http_listen: 0.0.0.0:8080
  # Names of Services instead of the fixed addresses of Docker Compose,
  # since Pod addresses change.
  hss_provisioning: http://hss.ims.svc.cluster.local:8081
  # The EPC stub, whose procedures that the network initiates the
  # Lab passes on at /api/epc: a learner makes the network
  # deactivate a UE's voice bearer with
  # DELETE /api/epc/network-initiated/ues/<IMSI>/bearers/<EBI> on the host.
  epc: http://epc.ims.svc.cluster.local:8080
  # No fault agent here: it breaks containers through the Docker socket,
  # which no Pod has. The page says that it is not configured, and its
  # fault panel stays off.
  # The UE simulators ue-a and ue-b of ue.yaml. They start with zero
  # replicas, like the sim profile of compose.yaml; until they are
  # scaled up, the web UI shows them as not reachable. volte-a and
  # volte-b have no Pods: a VoLTE UE needs the static address that the
  # EPC stub hands its subscriber, which a Pod cannot ask for, so the
  # web UI always shows them as not reachable.
  ues:
    - name: ue-a
      control: http://ue-a.ims.svc.cluster.local:8090
    - name: ue-b
      control: http://ue-b.ims.svc.cluster.local:8090
    - name: volte-a
      control: http://volte-a.ims.svc.cluster.local:8090
    - name: volte-b
      control: http://volte-b.ims.svc.cluster.local:8090
    - name: ue-c
      control: http://ue-c.ims.svc.cluster.local:8090
