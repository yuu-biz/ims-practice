# Generated by "go generate ./deploy/k8s/..." from
# deploy/compose/icscf.yaml and
# deploy/k8s/changes.go. Change those, not this file.

# I-CSCF. It asks the HSS over Cx which S-CSCF serves a user, and
# forwards the REGISTER there.
node: icscf
roles: [icscf]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
icscf:
  sip:
    listen: 0.0.0.0:5060
    host: icscf.ims.mnc001.mcc001.3gppnetwork.org
  # The S-CSCFs to choose from when the HSS returns capabilities
  # (TS 29.228 6.7).
  scscfs:
    - name: sip:scscf.ims.mnc001.mcc001.3gppnetwork.org:5060
      capabilities: [1]
  # The subdomains of public service identities, which DNS resolves to
  # the application server that hosts them: a request from another
  # network for a conference URI goes to the MMTel AS without a query to
  # the HSS (TS 24.229 5.3.2.1 step 3).
  psi_subdomains:
    - conf.ims.mnc001.mcc001.3gppnetwork.org
diameter:
  origin_host: icscf.ims.mnc001.mcc001.3gppnetwork.org
  origin_realm: ims.mnc001.mcc001.3gppnetwork.org
  peers:
    - address: hss.ims.mnc001.mcc001.3gppnetwork.org:3868
      origin_host: hss.ims.mnc001.mcc001.3gppnetwork.org
      kind: hss
  # The RFC defaults, written out where an operator can change them:
  # Tw is the watchdog timer (RFC 3539 3.4.1 [1]), and Tc the time
  # between attempts to connect again (RFC 6733 2.1 and 12).
  timers:
    tw: 30s
    tc: 30s
# Copies of every SIP and Diameter message for the dashboard.
# The dashboard's Service keeps one ClusterIP while its Pod comes and
# goes, so the name resolves even when the dashboard is down; the
# dashboard is not on the call path. HEP is one-way UDP, and the
# NAT of kube-proxy in front of a ClusterIP does no harm to it.
hep:
  collector: dashboard.ims.svc.cluster.local:9060
