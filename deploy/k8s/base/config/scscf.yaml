# Generated by "go generate ./deploy/k8s/..." from
# deploy/compose/scscf.yaml and
# deploy/k8s/changes.go. Change those, not this file.

# S-CSCF. It authenticates users with SIP Digest, using the H(A1) that
# the HSS returns over Cx, and is the registrar of the home network.
node: scscf
roles: [scscf]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
scscf:
  sip:
    listen: 0.0.0.0:5060
    host: scscf.ims.mnc001.mcc001.3gppnetwork.org
  # The UE asks for 600000 s (TS 24.229 5.1.1.2.1). The operator decides
  # how long a registration may last, and the S-CSCF shortens a longer
  # request to max_expires. A longer maximum means fewer refreshes, and
  # leaves the binding of a UE that has gone away for longer. A nonzero
  # expiry below min_expires gets 423 (RFC 3261 10.3); 0 deregisters.
  min_expires: 60
  max_expires: 3600
diameter:
  origin_host: scscf.ims.mnc001.mcc001.3gppnetwork.org
  origin_realm: ims.mnc001.mcc001.3gppnetwork.org
  peers:
    - address: hss.ims.mnc001.mcc001.3gppnetwork.org:3868
      origin_host: hss.ims.mnc001.mcc001.3gppnetwork.org
      kind: hss
  # The RFC defaults, written out where an operator can change them:
  # Tw is the watchdog timer (RFC 3539 3.4.1 [1]), and Tc the time
  # between attempts to connect again (RFC 6733 2.1 and 12).
  timers:
    tw: 30s
    tc: 30s
# Copies of every SIP and Diameter message for the Lab.
# The Lab's Service keeps one ClusterIP while its Pod comes and
# goes, so the name resolves even when the Lab is down; the
# Lab is not on the call path. HEP is one-way UDP, and the
# NAT of kube-proxy in front of a ClusterIP does no harm to it.
hep:
  collector: lab.ims.svc.cluster.local:9060
# The maintenance listener, where the node serves the metrics of the
# S-CSCF at /metrics for Prometheus to scrape. No specification gives a
# port for it; 8085 is this project's choice. It is not published
# outside the network of the IMS nodes.
maintenance:
  listen: 0.0.0.0:8085
