# Media relay in the IMS-AGW role (TS 23.334). The P-CSCF controls
# it over a small HTTP API, and RTP flows through it.
node: agw
roles: [agw]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
agw:
  control: 0.0.0.0:8080
  # The Pod's own address, which the P-CSCF writes into SDP. Kubernetes
  # gives a Pod a new address each time it starts, so the init container
  # in agw.yaml (the StatefulSet) writes it in place of ${POD_IP}. The UE
  # Pods send RTP to it directly, without a Service in between.
  rtp_address: ${POD_IP}
  # The same range as in Docker Compose. A UE outside the cluster needs
  # these ports on the node, which the component edge opens with
  # hostPort.
  rtp_ports:
    min: 40000
    max: 40039
