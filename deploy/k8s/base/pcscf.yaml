# P-CSCF. A StatefulSet with a headless Service for the same reasons as
# the I-CSCF (icscf.yaml). The UE Pods send to the P-CSCF Pod's address,
# and the P-CSCF answers from it, so the P-CSCF sees each UE at the
# address the UE wrote in Via and Contact.
apiVersion: v1
kind: Service
metadata:
  name: pcscf
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: pcscf
  ports:
    # RFC 3261 19.1.2. The UDP port is named "sip", so the cluster DNS
    # also answers the SRV name _sip._udp.pcscf.ims.svc.cluster.local
    # (RFC 2782), in the form RFC 3263 uses.
    - name: sip
      port: 5060
      protocol: UDP
    - name: sip-tcp
      port: 5060
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pcscf
spec:
  serviceName: pcscf
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: pcscf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pcscf
    spec:
      terminationGracePeriodSeconds: 10
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: ims
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: sip
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/ims
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pcscf-config
