# EPC stub with the PCRF stub inside it. A
# StatefulSet with headless Services, like the HSS (hss.yaml): the PCRF
# is a Diameter peer of the P-CSCF with its own Origin-Host.
apiVersion: v1
kind: Service
metadata:
  name: epc
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: epc
  ports:
    # The API of the stub: the UE API, the state of a UE, and the
    # procedures that the network initiates.
    - name: api
      port: 8080
      protocol: TCP
---
# The PCRF inside the EPC stub, under a name of its own, so that the
# P-CSCF's Diameter peer reads as the PCRF (the pcrf name in the zone).
apiVersion: v1
kind: Service
metadata:
  name: pcrf
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: epc
  ports:
    # Rx over Diameter, RFC 6733 2.1.
    - name: diameter
      port: 3868
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: epc
spec:
  serviceName: epc
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: epc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epc
    spec:
      terminationGracePeriodSeconds: 10
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # The PCO carries the P-CSCF's address, not its name (TS 24.229
      # L.2.2.1), and the stub takes addresses only. The init container
      # waits until the P-CSCF Pod has one and writes it into the file.
      # When the P-CSCF Pod starts again with another address, the EPC
      # has to be restarted too, since it reads the address only here.
      initContainers:
        - name: config
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until addr="$(nslookup -type=a pcscf.ims.svc.cluster.local 2>/dev/null | awk '/^Name:/ { n = 1 } n && /^Address/ { print $2; exit }')" && [ -n "$addr" ]; do
                echo "waiting for the address of the P-CSCF"
                sleep 2
              done
              sed "s/[$]{PCSCF_IP}/$addr/g" /etc/ims-template/node.yaml > /etc/ims/node.yaml
          volumeMounts:
            - name: template
              mountPath: /etc/ims-template
              readOnly: true
            - name: config
              mountPath: /etc/ims
      containers:
        - name: ims
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: diameter
              containerPort: 3868
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/ims
              readOnly: true
      volumes:
        - name: template
          configMap:
            name: epc-config
        - name: config
          emptyDir: {}
