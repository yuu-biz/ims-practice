# HSS stub. A StatefulSet, because each HSS is a Diameter peer
# with its own Origin-Host, and a peer is reached at a name that stays
# with it. The headless Service (clusterIP: None) makes the DNS name
# resolve to the Pod's own address, so the Diameter connections in a
# capture run between the addresses of the two nodes, with no NAT.
apiVersion: v1
kind: Service
metadata:
  name: hss
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: hss
  ports:
    # RFC 6733 2.1. Diameter over TCP, the transport every peer here uses.
    - name: diameter
      port: 3868
      protocol: TCP
    # The project's own subscriber API, used by the dashboard and the OAM.
    - name: provisioning
      port: 8081
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hss
spec:
  serviceName: hss
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: hss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hss
    spec:
      # Enough for the DPR and DPA on SIGTERM; the answer timeout is 5 s
      # (internal/config).
      terminationGracePeriodSeconds: 10
      # Names with a dot are asked as they are, without the search list
      # first, so the capture holds only the queries the node means.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: ims
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: diameter
              containerPort: 3868
              protocol: TCP
            - name: provisioning
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/ims
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hss-config
