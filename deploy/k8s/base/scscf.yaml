# S-CSCF, the registrar of the home network. A StatefulSet with a
# headless Service for the same reasons as the I-CSCF (icscf.yaml). Its
# name is also the Server-Name that the HSS hands out, which has to
# lead to the same S-CSCF for as long as the user is registered.
apiVersion: v1
kind: Service
metadata:
  name: scscf
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: scscf
  ports:
    # RFC 3261 19.1.2. The UDP port is named "sip", so the cluster DNS
    # also answers the SRV name _sip._udp.scscf.ims.svc.cluster.local
    # (RFC 2782), in the form RFC 3263 uses.
    - name: sip
      port: 5060
      protocol: UDP
    - name: sip-tcp
      port: 5060
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scscf
spec:
  serviceName: scscf
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: scscf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scscf
    spec:
      terminationGracePeriodSeconds: 10
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: ims
          image: ims-practice/ims:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: sip
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/ims
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: scscf-config
