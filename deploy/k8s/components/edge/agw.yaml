# The media relay node on an edge node of the cloud (kustomization.yaml),
# next to the P-CSCF.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agw
spec:
  template:
    spec:
      nodeSelector:
        ims-practice/pool: edge
      tolerations:
        - key: ims-practice/pool
          operator: Equal
          value: edge
          effect: NoSchedule
      # On the P-CSCF's node: the P-CSCF shows the UE the relay at
      # edge_public_address, which is that node's address.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: pcscf
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ims
          # Each port of rtp_ports in base/config/agw.yaml on the same port
          # of the node. A hostPort is one port; Kubernetes has no range,
          # so each has an entry.
          ports:
            - {name: rtp-40000, containerPort: 40000, hostPort: 40000, protocol: UDP}
            - {name: rtp-40001, containerPort: 40001, hostPort: 40001, protocol: UDP}
            - {name: rtp-40002, containerPort: 40002, hostPort: 40002, protocol: UDP}
            - {name: rtp-40003, containerPort: 40003, hostPort: 40003, protocol: UDP}
            - {name: rtp-40004, containerPort: 40004, hostPort: 40004, protocol: UDP}
            - {name: rtp-40005, containerPort: 40005, hostPort: 40005, protocol: UDP}
            - {name: rtp-40006, containerPort: 40006, hostPort: 40006, protocol: UDP}
            - {name: rtp-40007, containerPort: 40007, hostPort: 40007, protocol: UDP}
            - {name: rtp-40008, containerPort: 40008, hostPort: 40008, protocol: UDP}
            - {name: rtp-40009, containerPort: 40009, hostPort: 40009, protocol: UDP}
            - {name: rtp-40010, containerPort: 40010, hostPort: 40010, protocol: UDP}
            - {name: rtp-40011, containerPort: 40011, hostPort: 40011, protocol: UDP}
            - {name: rtp-40012, containerPort: 40012, hostPort: 40012, protocol: UDP}
