# RTP of the relay on the load balancer's address (kustomization.yaml).
apiVersion: v1
kind: Service
metadata:
  name: agw-public
  annotations:
    # The static public IP that deploy/cloud/azure made, by its name and
    # resource group ("Use a static public IP address and DNS label with
    # the AKS load balancer"). kustomization.yaml writes both from the
    # environment.
    service.beta.kubernetes.io/azure-pip-name: ""
    service.beta.kubernetes.io/azure-load-balancer-resource-group: ""
spec:
  type: LoadBalancer
  # Local keeps the UE's address as the source, so that the P-CSCF sees
  # where the UE is and host_access matches (components/edge). AKS's load
  # balancer has floating IP on, so it sends to the node with the
  # Service's address as the destination, and needs no NodePort then.
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  # spec.loadBalancerSourceRanges: load_balancer_source_range of the
  # environment, which kustomization.yaml writes. It narrows the rule that
  # AKS adds for the Service, next to the NSG of the edge subnet, the only
  # wall between the edge nodes and the internet.
  selector:
    app.kubernetes.io/name: agw
  ports:
    # rtp_ports of base/config/agw.yaml, one entry each, since a Service
    # port cannot be a range.
    - {name: rtp-40000, port: 40000, protocol: UDP}
    - {name: rtp-40001, port: 40001, protocol: UDP}
    - {name: rtp-40002, port: 40002, protocol: UDP}
    - {name: rtp-40003, port: 40003, protocol: UDP}
    - {name: rtp-40004, port: 40004, protocol: UDP}
    - {name: rtp-40005, port: 40005, protocol: UDP}
    - {name: rtp-40006, port: 40006, protocol: UDP}
    - {name: rtp-40007, port: 40007, protocol: UDP}
    - {name: rtp-40008, port: 40008, protocol: UDP}
    - {name: rtp-40009, port: 40009, protocol: UDP}
    - {name: rtp-40010, port: 40010, protocol: UDP}
    - {name: rtp-40011, port: 40011, protocol: UDP}
