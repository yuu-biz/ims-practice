# MRFP, the media side of the MRF (TS 23.333). It is the same media
# relay as the agw node, controlled by the MRFC over a small HTTP API
# in the place of H.248 on Mp. It plays announcements and mixes the
# media of a conference.
node: mrfp
roles: [mrfp]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
mrfp:
  control: 0.0.0.0:8080
  rtp_address: 172.28.0.86
  # A range of its own, apart from the agw's, so that a port in the
  # capture tells which node it belongs to.
  rtp_ports:
    min: 40100
    max: 40199
  # The announcements, by the name with which an MRFC asks for one as
  # /provisioned/<name> (RFC 4240 3.3). compose.yaml mounts the WAV
  # files of deploy/announcements here.
  announcements:
    notice: /usr/share/ims/announcements/notice.wav
    cat1: /usr/share/ims/announcements/cat1.wav
    cat2: /usr/share/ims/announcements/cat2.wav

# The maintenance listener: the maintenance API under /maintenance/v1/,
# through which an operator takes this media relay out of service, and
# /metrics for Prometheus to scrape. The relay counts no measurement of
# its own, so that page is empty, and the target shows as up. No
# specification gives a port for the listener; 8085 is this project's
# choice. The API asks for no password, so the port is not published
# outside the network of the IMS nodes.
maintenance:
  listen: 0.0.0.0:8085
