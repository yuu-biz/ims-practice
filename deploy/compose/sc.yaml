# The Service Centre of SMS: the SMS-SC that holds the short messages of
# the network, with the SMS-IWMSC that takes them from the IP-SM-GW and
# the SMS-GMSC that delivers them, which TS 23.040 4.1 lets one node be.
# It accepts Diameter connections from the serving nodes on the standard
# port 3868 (RFC 6733 2.1), because the serving node is the end that
# brings the mobile originated short messages, and opens one to the HSS
# to ask where a user is and to report a delivery that failed.
node: sc
roles: [sc]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
sc:
  # The address of the SC, the same number as the service_centre of
  # ipsmgw.yaml: a UE puts it in the RP-DA of a short message, the
  # IP-SM-GW passes it on in the SC-Address of every request, and the
  # HSS reads it to find which Service Centre to alert. A test number in
  # the 555-0100 to 555-0199 range of the North American Numbering Plan,
  # which no real line has.
  address: "+12025550100"
  # How long the SC waits before it tries a delivery that failed again.
  # TS 23.040 3.2.7 NOTE 5 leaves these autonomous retries to the
  # operator. One hour, so that what delivers a short message the SC
  # holds is the alert of the HSS: the retry is there for an alert that
  # never comes, which happens when the user comes back while no HSS
  # instance the SC is connected to answers the request.
  retry_delays: [1h]
diameter:
  origin_host: sc.ims.mnc001.mcc001.3gppnetwork.org
  origin_realm: ims.mnc001.mcc001.3gppnetwork.org
  listen: 0.0.0.0:3868
  peers:
    - address: hss.ims.mnc001.mcc001.3gppnetwork.org:3868
      origin_host: hss.ims.mnc001.mcc001.3gppnetwork.org
      kind: hss
  # The RFC defaults, written out where an operator can change them:
  # Tw is the watchdog timer (RFC 3539 3.4.1 [1]), and Tc the time
  # between attempts to connect again (RFC 6733 2.1 and 12).
  timers:
    tw: 30s
    tc: 30s
# Copies of every SIP and Diameter message for the Lab.
# The address is fixed so that the node starts even when the Lab
# is down; the Lab is not on the call path.
hep:
  collector: 172.28.0.60:9060
# The maintenance listener: the metrics of the SC at /metrics for
# Prometheus to scrape, which are the Diameter it speaks over S6c, and
# the maintenance API under /maintenance/v1/, through which an operator
# takes the SC out of service. No specification gives a port for it;
# 8085 is this project's choice. The API asks for no password, so the
# port is not published outside the network of the IMS nodes.
maintenance:
  listen: 0.0.0.0:8085
