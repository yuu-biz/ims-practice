# The Lab. It builds its view only from the HEP copies the
# nodes send, and serves the web UI on port 8080.
node: lab
roles: [lab]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
lab:
  hep_listen: 0.0.0.0:9060
  http_listen: 0.0.0.0:8080
  hss_provisioning: http://172.28.0.10:8081
  # The EPC stub, whose procedures that the network initiates the
  # Lab passes on at /api/epc: a learner makes the network
  # deactivate a UE's voice bearer with
  # DELETE /api/epc/network-initiated/ues/<IMSI>/bearers/<EBI> on the host.
  epc: http://172.28.0.80:8080
  # The fault agent, whose faults the Lab passes on at /api/fault: a
  # learner breaks a node from the page and clears the fault again. The
  # agent runs only with deploy/chaos/agent.yaml, which is also what
  # puts the Lab on the network chaos where this address is; without it
  # the page says that the agent is not running.
  fault_agent: http://172.28.9.10:8080
  # The UE simulators of the phones and volte profiles in compose.yaml.
  # Without its profile the web UI shows a UE as not reachable.
  ues:
    - name: phone1
      control: http://172.28.0.110:8090
    - name: phone2
      control: http://172.28.0.111:8090
    - name: volte-a
      control: http://172.28.0.120:8090
    - name: volte-b
      control: http://172.28.0.121:8090
    - name: phone3
      control: http://172.28.0.112:8090
