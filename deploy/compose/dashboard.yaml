# The dashboard. It builds its view only from the HEP copies the
# nodes send, and serves the web UI on port 8080.
node: dashboard
roles: [dashboard]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
dashboard:
  hep_listen: 0.0.0.0:9060
  http_listen: 0.0.0.0:8080
  hss_provisioning: http://172.28.0.10:8081
  # The EPC stub, whose procedures that the network initiates the
  # dashboard passes on at /api/epc: a learner makes the network
  # deactivate a UE's voice bearer with
  # DELETE /api/epc/network-initiated/ues/<IMSI>/bearers/<EBI> on the host.
  epc: http://172.28.0.80:8080
  # The UE simulators of the sim and volte profiles in compose.yaml.
  # Without its profile the web UI shows a UE as not reachable.
  ues:
    - name: ue-a
      control: http://172.28.0.110:8090
    - name: ue-b
      control: http://172.28.0.111:8090
    - name: volte-a
      control: http://172.28.0.120:8090
    - name: volte-b
      control: http://172.28.0.121:8090
    - name: ue-c
      control: http://172.28.0.112:8090
