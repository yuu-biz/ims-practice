# IP-SM-GW, the application server for SMS over IP (TS 24.341 5.3.3),
# with the stub of the SC inside it. The S-CSCF sends it a
# third-party REGISTER for each registration and every short message a
# user sends, by the initial filter criteria in hss.yaml. After each
# third-party REGISTER it subscribes to the user's registration state.
# It reads and updates the HSS over Sh.
node: ipsmgw
roles: [ipsmgw]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
ipsmgw:
  # The SIP URI, sip:ipsmgw.ims.mnc001.mcc001.3gppnetwork.org:5060, is
  # the server_name of the filter criteria in hss.yaml, and the
  # P-Asserted-Identity of the MESSAGEs the IP-SM-GW sends.
  sip:
    listen: 0.0.0.0:5060
    host: ipsmgw.ims.mnc001.mcc001.3gppnetwork.org
  # Test numbers in the 555-0100 to 555-0199 range of the North American
  # Numbering Plan, which no real line has. The IP-SM-GW registers its
  # number in the HSS for each user it serves (TS 29.328 7.6.16).
  number: "+12025550199"
  # The address of the SC. A UE puts it in the RP-DA of a short message,
  # and the IP-SM-GW in the RP-OA of a short message to a UE.
  service_centre: "+12025550100"
diameter:
  origin_host: ipsmgw.ims.mnc001.mcc001.3gppnetwork.org
  origin_realm: ims.mnc001.mcc001.3gppnetwork.org
  peers:
    - address: hss.ims.mnc001.mcc001.3gppnetwork.org:3868
      origin_host: hss.ims.mnc001.mcc001.3gppnetwork.org
      kind: hss
  # The RFC defaults, written out where an operator can change them:
  # Tw is the watchdog timer (RFC 3539 3.4.1 [1]), and Tc the time
  # between attempts to connect again (RFC 6733 2.1 and 12).
  timers:
    tw: 30s
    tc: 30s
# Copies of every SIP and Diameter message for the Lab.
# The address is fixed so that the node starts even when the Lab
# is down; the Lab is not on the call path.
hep:
  collector: 172.28.0.60:9060
# The maintenance listener: the metrics of the IP-SM-GW at /metrics for
# Prometheus to scrape, which are the Diameter it speaks over Sh, and
# the maintenance API under /maintenance/v1/, through which an operator
# takes the IP-SM-GW out of service. No specification gives a port for
# it; 8085 is this project's choice. The API asks for no password, so
# the port is not published outside the network of the IMS nodes.
maintenance:
  listen: 0.0.0.0:8085
