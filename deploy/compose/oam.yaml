# The OAM server. It operates the other nodes through the maintenance
# API of each of them, provisions the subscribers through the
# provisioning API of the HSS, and serves the OAM screen.
node: oam
roles: [oam]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
oam:
  # The OAM API under /oam/v1/ and the OAM screen beside it. No
  # specification gives a port for them; 8080 is this project's choice,
  # the port the Lab serves its own screen on, in its own container. The
  # API changes the configuration of the nodes and hands out backups
  # that hold the credentials of every subscriber, and asks for no
  # password, so this port is not published on the host: a request
  # comes from inside the network of the IMS nodes.
  http_listen: 0.0.0.0:8080
  # The provisioning API of the HSS, through which the OAM adds,
  # changes, exports and removes subscriptions.
  hss_provisioning: http://hss.ims.mnc001.mcc001.3gppnetwork.org:8081
  # Where the OAM keeps what it holds itself: the history of the
  # configuration changes it made, and the backups. compose.yaml gives
  # it a named volume, so a restarted container finds them again. A
  # backup holds the long-term key, OPc and the passwords of every
  # subscription, so the directory is the OAM's own, readable by
  # nobody else.
  data_dir: /var/lib/ims/oam
  # The inventory: every node of this deployment that serves the
  # maintenance API, by the name it has in the home network domain. The
  # name of a node here is what the OAM API calls it, as in
  # /oam/v1/nodes/scscf/state; it need not be the node name of the
  # node's own configuration file, which two instances of a role share.
  # The roles are those the node's own file lists, and an operation on
  # a role goes to every node that has it.
  nodes:
    - name: hss
      roles: [hss]
      maintenance: http://hss.ims.mnc001.mcc001.3gppnetwork.org:8085
    - name: icscf
      roles: [icscf]
      maintenance: http://icscf.ims.mnc001.mcc001.3gppnetwork.org:8085
    - name: scscf
      roles: [scscf]
      maintenance: http://scscf.ims.mnc001.mcc001.3gppnetwork.org:8085
    - name: pcscf
      roles: [pcscf]
      maintenance: http://pcscf.ims.mnc001.mcc001.3gppnetwork.org:8085
    - name: agw
      roles: [agw]
      maintenance: http://agw.ims.mnc001.mcc001.3gppnetwork.org:8085
    - name: ipsmgw
      roles: [ipsmgw]
      maintenance: http://ipsmgw.ims.mnc001.mcc001.3gppnetwork.org:8085
    - name: mmtel
      roles: [mmtel]
      maintenance: http://mmtel.ims.mnc001.mcc001.3gppnetwork.org:8085
    - name: mrfc
      roles: [mrfc]
      maintenance: http://mrfc.ims.mnc001.mcc001.3gppnetwork.org:8085
    - name: mrfp
      roles: [mrfp]
      maintenance: http://mrfp.ims.mnc001.mcc001.3gppnetwork.org:8085
