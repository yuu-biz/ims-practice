# HSS stub of network B, the peer network. Network B
# runs the same image as network A with its own realm, numbers and
# subscribers, on the bridge ims1 (172.28.1.0/24).
node: hss-b
roles: [hss]
home_domain: ims.mnc002.mcc001.3gppnetwork.org
hss:
  server_capabilities:
    mandatory: [1]
  # Test subscribers of the test PLMN 001/02 (TS 23.003), with
  # fictional numbers of their own, +1 202 555 0151 and 0152. As in
  # network A (deploy/compose/hss.yaml), the private identity holds the
  # IMSI and the public identities hold the number, which is what
  # network A sees of these users. Network B has no MMTel AS, so they
  # have no supplementary services.
  subscriptions:
    - private_identity: 001020000000001@ims.mnc002.mcc001.3gppnetwork.org
      public_identities:
        - sip:+12025550151@ims.mnc002.mcc001.3gppnetwork.org
        - tel:+12025550151
      password: test-password-b1
    - private_identity: 001020000000002@ims.mnc002.mcc001.3gppnetwork.org
      public_identities:
        - sip:+12025550152@ims.mnc002.mcc001.3gppnetwork.org
        - tel:+12025550152
      password: test-password-b2
  # A service profile is a list of initial filter criteria, which tell
  # the S-CSCF which request goes to which application server (TS 29.228
  # B.2.2). The HSS holds its profiles by name and answers the SAA with
  # the criteria of the profile that the subscription gets; the name
  # itself stays in the HSS. A subscription that names no profile of its
  # own gets the one named here, or the one of test_user_service_profile
  # when it is marked test_user. Both settings name a profile of
  # service_profiles below. Only one profile is defined here, so every
  # subscription gets the same criteria.
  default_service_profile: default
  # Test users get the same criteria as every other user here. To try a
  # feature out on the test users alone, define a second profile with
  # the criteria of that feature and name it here.
  test_user_service_profile: default
  # Which subscribers the network admits. With all, every subscriber
  # here may register. With test_users, the HSS answers the UAR of a
  # subscriber that is not marked test_user with
  # DIAMETER_AUTHORIZATION_REJECTED, and the I-CSCF turns that into 403
  # (TS 29.228 6.1.1.1 step 5, TS 24.229 5.3.1.3). It also refuses to
  # give such a subscriber an S-CSCF for the services it would get while
  # it is not registered. No subscriber here is marked test_user, so
  # test_users would leave the network to the subscribers that an
  # operator marks through the provisioning API.
  admission: all
  # SMS over IP as in network A (deploy/compose/hss.yaml): the
  # third-party REGISTER and the short messages that a user sends go to
  # the IP-SM-GW.
  # feature on a criterion is the operator's word for what that
  # criterion turns on. The features of a profile are those words
  # without repetition, and the maintenance API lists them, so an
  # operator can read which profile turns a feature on without reading
  # every criterion. No criterion of Cx carries the word.
  service_profiles:
    default:
      - priority: 0
        feature: sms
        trigger_point: {condition_type_cnf: true, spt: [{group: [0], method: REGISTER}]}
        application_server: {server_name: sip:ipsmgw.ims.mnc002.mcc001.3gppnetwork.org:5060, default_handling: SESSION_CONTINUED, service_info: "{msisdn}"}
      - priority: 1
        feature: sms
        trigger_point:
          condition_type_cnf: true
          spt:
            - {group: [0], method: MESSAGE}
            - {group: [1], sip_header: {header: ^Content-Type$, content: '^[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]/[Vv][Nn][Dd]\.3[Gg][Pp][Pp]\.[Ss][Mm][Ss]([[:space:]]*;.*)?$'}}
            - {group: [2], session_case: ORIGINATING_REGISTERED}
        # Ends with the failure of the IP-SM-GW, as in deploy/compose/hss.yaml.
        application_server: {server_name: sip:ipsmgw.ims.mnc002.mcc001.3gppnetwork.org:5060, default_handling: SESSION_TERMINATED}
      # A short message for a user from another network reaches the
      # IP-SM-GW that serves the user (TS 23.204 6.4a step 2). The
      # IP-SM-GW's own MESSAGE to the user asserts its own URI and goes on
      # to the UE: the negated header keeps it from coming back (TS 23.218
      # 5.2.3 NOTE 5). Network A has the same criterion with its own
      # IP-SM-GW (deploy/compose/hss.yaml).
      - priority: 2
        feature: sms
        trigger_point:
          condition_type_cnf: true
          spt:
            - {group: [0], method: MESSAGE}
            - {group: [1], sip_header: {header: ^Content-Type$, content: '^[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]/[Vv][Nn][Dd]\.3[Gg][Pp][Pp]\.[Ss][Mm][Ss]([[:space:]]*;.*)?$'}}
            - {group: [2], session_case: TERMINATING_REGISTERED}
            - {group: [3], condition_negated: true, sip_header: {header: ^P-Asserted-Identity$, content: 'sip:ipsmgw\.ims\.mnc002\.mcc001\.3gppnetwork\.org'}}
        application_server: {server_name: sip:ipsmgw.ims.mnc002.mcc001.3gppnetwork.org:5060}
diameter:
  origin_host: hss.ims.mnc002.mcc001.3gppnetwork.org
  origin_realm: ims.mnc002.mcc001.3gppnetwork.org
  listen: 0.0.0.0:3868
  # The RFC defaults, written out where an operator can change them:
  # Tw is the watchdog timer (RFC 3539 3.4.1 [1]), and Tc the time
  # between attempts to connect again (RFC 6733 2.1 and 12).
  timers:
    tw: 30s
    tc: 30s
