# A mismatched agreement for the scenario of a MESSAGE mismatch:
# network A has no
# agreement on MESSAGE with network B, an optional method at a
# non-roaming II-NNI (TS 29.165 Table 6.1). IBCF-A answers a short
# message for network B with 405 (Method Not Allowed), and the SC of
# network A reports that it could not deliver it. network-b.yaml, which
# lists MESSAGE, is the adjusted agreement.
#
# Start IBCF-A with it:
#   IBCF_A_PROFILE=network-b-no-message.yaml docker compose ... up -d ibcf-a
name: network-b
domain: ims.mnc002.mcc001.3gppnetwork.org
trusted: true
transports: [udp, tcp]
methods: []
option_tags:
  100rel: pass
  precondition: pass
number_format: sip
codecs: [AMR-WB, AMR, PCMU, telephone-event]
headers:
  - {header: User-Agent, action: remove, direction: exit}
  - {header: Server, action: remove, direction: exit}
