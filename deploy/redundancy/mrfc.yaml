# The MRFC with the shared store. It is the file of the same name in
# deploy/compose with the store section at the end, which
# deploy/redundancy/redundancy.yaml mounts in that file's place.
# MRFC, the control side of the MRF (TS 23.228 4.7). The
# MMTel AS sends it an INVITE whose Request-URI names the service, as
# RFC 4240 defines: sip:annc@... to play an announcement and
# sip:conf=<id>@... to join a conference. The MRFC picks an MRFP and has
# it play or mix the media.
node: mrfc
roles: [mrfc]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
mrfc:
  # The SIP URI, sip:mrfc.ims.mnc001.mcc001.3gppnetwork.org:5060, is the
  # mrfc of mmtel.yaml. The host also goes into the Contact of each
  # dialog, so the requests within a dialog come back to this instance.
  sip:
    listen: 0.0.0.0:5060
    host: mrfc.ims.mnc001.mcc001.3gppnetwork.org
  # The MRFPs report here that an announcement has ended. Port 8080, on
  # which Wireshark decodes HTTP without settings, as it does for the
  # control API of the MRFP.
  notify: 0.0.0.0:8080
  # The control APIs of the MRFPs. Every MRFC instance lists the same
  # ones, in the same order.
  mrfp:
    - http://mrfp.ims.mnc001.mcc001.3gppnetwork.org:8080
# Copies of every SIP message for the Lab.
# The address is fixed so that the node starts even when the Lab
# is down; the Lab is not on the call path.
hep:
  collector: 172.28.0.60:9060

# The MRFC keeps in the shared store which MRFP and which context hold
# the mix of each conference, so that a party who reaches any instance
# joins the same mix.
# Without this section, as in deploy/compose, the node keeps all of it
# in the memory of its own process.
store:
  kind: valkey
  # The address of the store is fixed, like the HEP collector's above:
  # the node reads and writes state before it resolves any name, and the
  # store answers whatever the DNS of the home network is doing.
  address: 172.28.0.5:6379
  # Every key of this deployment begins with it, and the adapter of each
  # role adds the name of the role after it, as in
  # ims:scscf:registration:<private identity>. Groups of instances that
  # must not share their state take a prefix each.
  prefix: "ims:"
  # How long one operation on the store may take. A role that does not
  # get its state within it answers 500 in SIP, or
  # DIAMETER_UNABLE_TO_COMPLY in Diameter, rather than treat the failure
  # as an item that is not there.
  timeout: 1s
