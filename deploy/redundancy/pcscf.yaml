# The P-CSCF with the shared store. It is the file of the same name in
# deploy/compose with the store section at the end, which
# deploy/redundancy/redundancy.yaml mounts in that file's place.
# P-CSCF. The first contact point of the UE. It finds the I-CSCF of the
# home network through DNS (RFC 3263) and adds Path, so that requests
# to the UE come back through it.
node: pcscf
roles: [pcscf]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
pcscf:
  sip:
    listen: 0.0.0.0:5060
    host: pcscf.ims.mnc001.mcc001.3gppnetwork.org
  # The P-CSCF is in the home network, so its network name is the home
  # domain (TS 24.229 5.2.2.1).
  visited_network_id: ims.mnc001.mcc001.3gppnetwork.org
  # RTP goes through the media relay in the IMS-AGW role.
  media_relay: http://agw.ims.mnc001.mcc001.3gppnetwork.org:8080
  # A softphone on the host comes through Docker's NAT from the bridge
  # gateway, and reaches the relay's ports where compose.yaml publishes
  # them.
  host_access:
    gateway: 172.28.0.1
    address: 127.0.0.1
  # IMS AKA: a UE that registers with Security-Client sends
  # everything after the challenge to this protected server port (TS
  # 33.203 7.1). No ESP protects it, so that the capture
  # shows the content.
  sec_agree:
    protected_server_port: 5064
# Rx to the PCRF stub in the epc node. The PCRF knows only
# the UEs that attached to the EPC stub; for any other UE, such as a
# softphone on the host, it answers IP-CAN_SESSION_NOT_AVAILABLE, and the
# P-CSCF serves that UE without policy control.
diameter:
  origin_host: pcscf.ims.mnc001.mcc001.3gppnetwork.org
  origin_realm: ims.mnc001.mcc001.3gppnetwork.org
  peers:
    - address: pcrf.ims.mnc001.mcc001.3gppnetwork.org:3868
      origin_host: pcrf.ims.mnc001.mcc001.3gppnetwork.org
  # The RFC defaults, written out where an operator can change them:
  # Tw is the watchdog timer (RFC 3539 3.4.1 [1]), and Tc the time
  # between attempts to connect again (RFC 6733 2.1 and 12).
  timers:
    tw: 30s
    tc: 30s
# Copies of every SIP and Diameter message for the dashboard.
# The address is fixed so that the node starts even when the dashboard
# is down; the dashboard is not on the call path.
hep:
  collector: 172.28.0.60:9060

# The P-CSCF keeps its state in the shared store: the IP association of
# each registered UE, the dialogs of its calls, its security
# associations and its own subscription to the registration state of
# each UE.
# Without this section, as in deploy/compose, the node keeps all of it
# in the memory of its own process.
store:
  kind: valkey
  # The address of the store is fixed, like the HEP collector's above:
  # the node reads and writes state before it resolves any name, and the
  # store answers whatever the DNS of the home network is doing.
  address: 172.28.0.5:6379
  # Every key of this deployment begins with it, and the adapter of each
  # role adds the name of the role after it, as in
  # ims:scscf:registration:<private identity>. Groups of instances that
  # must not share their state take a prefix each.
  prefix: "ims:"
  # How long one operation on the store may take. A role that does not
  # get its state within it answers 500 in SIP, or
  # DIAMETER_UNABLE_TO_COMPLY in Diameter, rather than treat the failure
  # as an item that is not there.
  timeout: 1s
