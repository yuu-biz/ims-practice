# The IP-SM-GW with the shared store. It is the file of the same name in
# deploy/compose with the store section at the end, which
# deploy/redundancy/redundancy.yaml mounts in that file's place.
# IP-SM-GW, the application server for SMS over IP (TS 24.341 5.3.3),
# with the stub of the SC inside it. The S-CSCF sends it a
# third-party REGISTER for each registration and every short message a
# user sends, by the initial filter criteria in hss.yaml. After each
# third-party REGISTER it subscribes to the user's registration state.
# It reads and updates the HSS over Sh.
node: ipsmgw
roles: [ipsmgw]
home_domain: ims.mnc001.mcc001.3gppnetwork.org
ipsmgw:
  # The SIP URI, sip:ipsmgw.ims.mnc001.mcc001.3gppnetwork.org:5060, is
  # the server_name of the filter criteria in hss.yaml, and the
  # P-Asserted-Identity of the MESSAGEs the IP-SM-GW sends.
  sip:
    listen: 0.0.0.0:5060
    host: ipsmgw.ims.mnc001.mcc001.3gppnetwork.org
  # Test numbers in the 555-0100 to 555-0199 range of the North American
  # Numbering Plan, which no real line has. The IP-SM-GW registers its
  # number in the HSS for each user it serves (TS 29.328 7.6.16).
  number: "+12025550199"
  # The address of the SC. A UE puts it in the RP-DA of a short message,
  # and the IP-SM-GW in the RP-OA of a short message to a UE.
  service_centre: "+12025550100"
diameter:
  origin_host: ipsmgw.ims.mnc001.mcc001.3gppnetwork.org
  origin_realm: ims.mnc001.mcc001.3gppnetwork.org
  peers:
    - address: hss.ims.mnc001.mcc001.3gppnetwork.org:3868
      origin_host: hss.ims.mnc001.mcc001.3gppnetwork.org
  # The RFC defaults, written out where an operator can change them:
  # Tw is the watchdog timer (RFC 3539 3.4.1 [1]), and Tc the time
  # between attempts to connect again (RFC 6733 2.1 and 12).
  timers:
    tw: 30s
    tc: 30s
# Copies of every SIP and Diameter message for the dashboard.
# The address is fixed so that the node starts even when the dashboard
# is down; the dashboard is not on the call path.
hep:
  collector: 172.28.0.60:9060

# The IP-SM-GW keeps its state in the shared store: the short messages
# it is waiting for a report on, the RP-MR counter of each recipient,
# its subscriptions to the reg event, and the status reports that the
# SC stub owes the senders.
# Without this section, as in deploy/compose, the node keeps all of it
# in the memory of its own process.
store:
  kind: valkey
  # The address of the store is fixed, like the HEP collector's above:
  # the node reads and writes state before it resolves any name, and the
  # store answers whatever the DNS of the home network is doing.
  address: 172.28.0.5:6379
  # Every key of this deployment begins with it, and the adapter of each
  # role adds the name of the role after it, as in
  # ims:scscf:registration:<private identity>. Groups of instances that
  # must not share their state take a prefix each.
  prefix: "ims:"
  # How long one operation on the store may take. A role that does not
  # get its state within it answers 500 in SIP, or
  # DIAMETER_UNABLE_TO_COMPLY in Diameter, rather than treat the failure
  # as an item that is not there.
  timeout: 1s
