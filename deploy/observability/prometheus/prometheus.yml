# Prometheus configuration for the Compose project.
#
# The ims job between the BEGIN and END lines is made from the root
# compose.yaml by "go generate ./deploy/observability/..."
# (deploy/observability/prometheus.go). Edit everything else here by
# hand.
#
# ASSUMPTION: every IMS node serves internal/metrics at /metrics, on
# the listener of its maintenance API, on the port MetricsPort in
# deploy/observability/prometheus.go. Only the P-CSCF, the I-CSCF, the
# S-CSCF, the HSS and the MMTel AS serve it: a node that does not shows
# as down, here and in the "Up" panel of the Grafana dashboard. The node
# of the MRFC has that listener for its maintenance API and counts no
# measurement, so it is up with nothing to scrape.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Every node of compose.yaml, by its service name. Docker's own DNS
  # answers these names inside the container, so the scrapes cause no
  # queries to the dns service of the IMS.
  #
  # The target label is "node", not "role": the nodes already put a
  # "role" label on their metrics (one node may have several roles),
  # and a target label of the same name would rename theirs to
  # "exported_role".
  # BEGIN generated by "go generate ./deploy/observability/..." from compose.yaml. Do not edit these lines.
  - job_name: ims
    metrics_path: /metrics
    static_configs:
      - targets: ["hss:8085"]
        labels: {node: hss}
      - targets: ["icscf:8085"]
        labels: {node: icscf}
      - targets: ["scscf:8085"]
        labels: {node: scscf}
      - targets: ["pcscf:8085"]
        labels: {node: pcscf}
      - targets: ["agw:8085"]
        labels: {node: agw}
      - targets: ["ipsmgw:8085"]
        labels: {node: ipsmgw}
      - targets: ["mmtel:8085"]
        labels: {node: mmtel}
      - targets: ["epc:8085"]
        labels: {node: epc}
      - targets: ["mrfc:8085"]
        labels: {node: mrfc}
      - targets: ["mrfp:8085"]
        labels: {node: mrfp}
      - targets: ["lab:8085"]
        labels: {node: lab}
  # END generated

  # Prometheus itself, so that the setup can be checked before any IMS
  # node serves metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
